# Once a day: download every OTT app's upcoming list for India and save it to the `data` branch
# (the website reads it from there, so the site itself doesn't redeploy every day).
name: Upcoming on OTT
on:
  schedule:
    - cron: "41 20 * * *"          # 02:11 India time, every day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/upcoming*.py", ".github/workflows/upcoming.yml"]
permissions:
  contents: write
concurrency: { group: upcoming, cancel-in-progress: true }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download upcoming lists
        run: python scripts/upcoming.py
      - name: Save to the data branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -x
          mkdir -p /tmp/out && cp -f *.json /tmp/out/ || true
          cd /tmp/out && ls -la
          git init -q && git checkout -q -b data
          git config user.name "vibesync-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Upcoming on OTT: $(date -u +%F)" || { echo "::error::commit failed"; exit 1; }
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data 2>&1 | tail -5 > /tmp/push.txt; r=${PIPESTATUS[0]}
          [ "$r" = 0 ] || { echo "::error title=push::$(tr '\n' ' ' < /tmp/push.txt)"; exit 1; }
