/* scroll: glass top bar, hero parallax, pause the spotlight when it's off screen */
let heroOff = false, ticking = false;
// The spotlight's parallax + fade runs on the GPU compositor through a CSS scroll timeline where the
// browser supports it, so scrolling never waits on script. Otherwise JS drives it, reading layout first
// and writing after, so a frame never forces an extra layout pass.
const SCROLL_TL = CSS.supports("animation-timeline", "scroll()");
const SC = {solid: null, glass: null, h: 0, tabsTop: 0, slideY: -1};
function onScroll() {
  ticking = false;
  const sc = scroller(), y = sc.scrollTop, hero = $("#hero"), top = $("#top"), slides = $("#slides"), tabs = $("#tabs");
  if (!hero) return;
  // reads
  if (!SC.h) SC.h = hero.offsetHeight;
  const h = SC.h, solid = y > 24;
  // writes (only when something changed)
  if (solid !== SC.solid) { SC.solid = solid; top.classList.toggle("solid", solid); }
  W.sy = -y * .12;                                            // read by the world loop (no page-wide style writes)
  if (!REDUCED && !SCROLL_TL && y < h + 40) {
    const ty = Math.min(y, h) * .32;
    if (Math.abs(ty - SC.slideY) > .5) { SC.slideY = ty; slides.style.transform = `translate3d(0,${ty}px,0)`; slides.style.opacity = Math.max(0, 1 - y / (h * .55)); }
  }
  const off = y > h * .7;
  if (off !== heroOff) { heroOff = off; if (!openId) pauseHero(off); }
}
// the category tabs turn to glass once they stick under the top bar: watched by an observer, not per frame
function watchTabs() {
  const s = $("#tabsent"), tabs = $("#tabs"); if (!s || !tabs || !window.IntersectionObserver) return;
  if (SC.io) SC.io.disconnect();

                                   {root: scroller(), rootMargin: "-61px 0px 100000px 0px", threshold: 0});
  SC.io.observe(s);
}

// hero: the spotlight follows your finger, the next title slides in alongside it, and letting go
// either carries on (far enough, or a quick flick) or springs back. Press and hold pauses, like stories.
(() => {
  let s = null, swallow = false;
  const slides = () => $$("#slides .slide");
  const clear = el => { if (el) { el.style.transform = ""; el.style.opacity = ""; el.style.transition = ""; el.style.willChange = ""; el.classList.remove("peek"); } };
  document.addEventListener("pointerdown", e => {
    const h = e.target.closest("#hero"); if (!h || e.button > 0 || e.target.closest("[data-dot]")) return;
    const all = slides(); if (all.length < 2) return;
    s = {x: e.clientX, y: e.clientY, dx: 0, v: 0, lx: e.clientX, lt: performance.now(), drag: false, w: h.clientWidth, cur: all[state.slide], nb: null, dir: 0};
    pauseHero(true);
  }, {passive: true});
  document.addEventListener("pointermove", e => {
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y, now = performance.now();
    if (!s.drag) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { s = null; if (!heroOff && !openId) pauseHero(false); return; }   // a scroll
      if (Math.abs(dx) < 8) return;
      s.drag = true;
    }
    s.v = s.v * .6 + .4 * (e.clientX - s.lx) / Math.max(1, now - s.lt); s.lx = e.clientX; s.lt = now; s.dx = dx;
    const dir = dx < 0 ? 1 : -1, all = slides();
    if (dir !== s.dir) { clear(s.nb); s.dir = dir; s.nb = all[(state.slide + dir + all.length) % all.length]; s.nb.classList.add("peek"); }
    const p = Math.min(1, Math.abs(dx) / s.w);
    s.cur.style.transition = s.nb.style.transition = "none"; s.cur.style.willChange = s.nb.style.willChange = "transform,opacity";
    s.cur.style.transform = `translate3d(${dx}px,0,0) scale(${1 - p * .06})`; s.cur.style.opacity = Math.max(0, 1 - p * 1.8);
    s.nb.style.transform = `translate3d(${dx + dir * s.w * .85}px,0,0) scale(${.94 + p * .06})`; s.nb.style.opacity = Math.min(1, p * 1.8);
  }, {passive: true});
  const end = () => {
    if (!s) return;
    const {drag, dx, v, w, cur, nb, dir} = s; s = null;
    if (!drag || !nb) { if (!heroOff && !openId) pauseHero(false); return; }
    swallow = true; setTimeout(() => swallow = false, 60);
    const go = Math.abs(dx) > w * .2 || (Math.abs(v) > .35 && Math.sign(v) === -dir);
    const ease = "cubic-bezier(.16,1,.3,1)", dur = Math.round(Math.max(260, 520 - Math.abs(v) * 160));
    if (go) {
      cur.style.transition = nb.style.transition = `transform ${dur}ms ${ease}, opacity ${dur}ms ${ease}`;
      cur.style.transform = `translate3d(${-dir * w * .6}px,0,0) scale(.94)`; cur.style.opacity = 0;
      nb.style.transform = "translate3d(0,0,0)"; nb.style.opacity = 1;
      setTimeout(() => { showSlide(state.slide + dir); requestAnimationFrame(() => { clear(cur); clear(nb); }); startHero(); if (!heroOff && !openId) pauseHero(false); }, dur);
    } else {
      cur.style.transition = nb.style.transition = `transform 480ms ${EASE}, opacity 380ms ease`;
      cur.style.transform = ""; cur.style.opacity = ""; nb.style.transform = `translate3d(${dir * w * .85}px,0,0)`; nb.style.opacity = 0;
      setTimeout(() => clear(nb), 480);
      if (!heroOff && !openId) pauseHero(false);
    }
  };
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);

})();

async function loadLive(key) {

  const rnd = key.startsWith("plat|");                 // platform rows: random pages from the top ~300, shuffled
  if (st.busy || (rnd ? st.order && !st.order.length : (st.page >= st.total || st.page >= 20))) return;
  st.busy = true;
  try {
    if (key.startsWith("plat|")) await ensureProviders();
    const def = liveDef(key);
    let pg = st.page + 1;
    if (rnd) pg = st.order ? st.order.shift() : 1 + Math.floor(Math.random() * 5);
    let j = await tget(def.path, Object.assign({page: pg}, def.params));
    if (rnd && !st.order) {
      if (!(j.results || []).length && pg > 1) { pg = 1; j = await tget(def.path, Object.assign({page: 1}, def.params)); }
      const max = Math.min(j.total_pages || 1, 15);
      st.order = shuffle(Array.from({length: max}, (_, i) => i + 1).filter(n => n !== pg));
    }
    if (rnd) { st.page += 1; st.total = 99; } else { st.page = j.page || st.page + 1; st.total = j.total_pages || 1; }
    if (rnd && j.results) j = Object.assign({}, j, {results: shuffle(j.results.slice())});
    const seen = new Set(st.ids);
    const fresh = (j.results || []).map(r => fromTmdb(r, def.type)).filter(it => it && !isWatched(it.id) && !seen.has(it.id) && (seen.add(it.id), true));
    // rows filtered to "streaming in India" vouch for their titles; trending lists also carry upcoming films
    if (def.params && def.params.with_watch_monetization_types) fresh.forEach(it => { if (it.tmdb) it.streams = true; });
    fresh.forEach(it => st.ids.push(it.id));
    const el = document.querySelector(`[data-live="${CSS.escape(key)}"]`);
    if (el) {
      if (st.page === 1) el.innerHTML = fresh.map(card).join("") || `<div class="empty">Nothing here yet.</div>`;
      else el.insertAdjacentHTML("beforeend", fresh.map(card).join(""));

async function b64z(str) {

  };

  openMixer = function () { undrain($("#mixer")); _om.apply(this, arguments); liquidIn($("#mixer"), $("#mixer .mx-in")); };
  closeMixer = function () { const m = $("#mixer"); if (!m.classList.contains("on") || m._drain) return; liquidOut(m, () => _cm()); };
  const _os = openSearch;
  openSearch = function () { _os.apply(this, arguments); liquidIn($("#search"), $("#search .sres")); };
}

/* ───────────── Google sign-in + cloud save (Firebase) ─────────────
   Sign in with Google at the start; everything VibeSync keeps on this device (Saved, Watching/Watched,
   ratings, tracker notes, reminders, taste, themes, subscriptions, settings) is merged with your account
   and saved to Firestore, so it follows you to any phone or browser.
   No SDKs: Google's sign-in button (web) or Android's own Google sign-in (app) gives a Google ID token,
   Firebase's REST API turns it into a Firebase session, and Firestore's REST API stores one document per user.
   Turns on only when the Firebase settings are in the Streamlit secrets. */
const AUTH = {cfg: null, user: store.get("auth", null), dirty: false, t: null, started: false, offline: false, last: store.get("authSaved", 0)};
const CLOUD_SKIP = /^vs\.(auth|authSaved|rt|widgetMeta|tonight)$/;
function setAuthConfig(c) {
  if (c && c.apiKey && c.projectId && c.clientId) AUTH.cfg = {apiKey: String(c.apiKey).trim(), projectId: String(c.projectId).trim(), clientId: String(c.clientId).trim()};
}
// every save to this device marks the account copy as out of date
{
  const _set = store.set.bind(store);
  store.set = (k, v) => { _set(k, v); if (!/^(auth|authSaved|rt|widgetMeta|tonight)$/.test(k)) cloudDirty(); };
}
const fbUrl = path => `${path}${path.includes("?") ? "&" : "?"}key=${encodeURIComponent(AUTH.cfg.apiKey)}`;
const fsDoc = () => `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(AUTH.cfg.projectId)}/databases/(default)/documents/users/${encodeURIComponent(AUTH.user.uid)}`;
async function postJSON(url, body, form) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": form ? "application/x-www-form-urlencoded" : "application/json"}, body: form ? body : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && (j.error.message || j.error)) || "HTTP " + r.status);
  return j;
}
function saveUser(u) { AUTH.user = u; store.set("auth", u); }
// a fresh Firebase ID token (they last an hour)
async function idToken() {
  const u = AUTH.user; if (!u) throw new Error("signed out");
  if (u.id && u.exp - Date.now() > 60000) return u.id;
  const j = await postJSON(fbUrl("https://securetoken.googleapis.com/v1/token"), `grant_type=refresh_token&refresh_token=${encodeURIComponent(u.refresh)}`, true);
  saveUser(Object.assign({}, u, {id: j.id_token, refresh: j.refresh_token || u.refresh, exp: Date.now() + (+j.expires_in || 3600) * 1000}));
  return AUTH.user.id;
}
// Google ID token -> Firebase session
async function firebaseSignIn(googleIdToken) {
  const j = await postJSON(fbUrl("https://identitytoolkit.googleapis.com/v1/accounts:signInWithIdp"),
    {postBody: `id_token=${encodeURIComponent(googleIdToken)}&providerId=google.com`, requestUri: location.origin || "http://localhost", returnSecureToken: true, returnIdpCredential: true});
  saveUser({uid: j.localId, email: j.email || "", name: j.displayName || j.fullName || (j.email || "").split("@")[0], photo: j.photoUrl || "",
            id: j.idToken, refresh: j.refreshToken, exp: Date.now() + (+j.expiresIn || 3600) * 1000, isNew: !!j.isNewUser});
}
function localData() {
  const d = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("vs.") && !CLOUD_SKIP.test(k)) d[k] = localStorage.getItem(k); }
  return d;
}
async function cloudLoad() {
  const r = await fetch(fsDoc(), {headers: {Authorization: "Bearer " + await idToken()}});
  if (r.status === 404) return null;                    // first sign-in: nothing saved yet
  if (!r.ok) throw new Error("Firestore " + r.status);
  const j = await r.json(), f = j.fields || {};
  try { return JSON.parse((f.data && f.data.stringValue) || "{}"); } catch (e) { return {}; }
}
async function cloudSave(keepalive) {
  if (!AUTH.cfg || !AUTH.user || AUTH.offline) return;
  clearTimeout(AUTH.t); AUTH.dirty = false;
  try {
    const body = {fields: {data: {stringValue: JSON.stringify(localData())}, updatedAt: {timestampValue: new Date().toISOString()},
                           email: {stringValue: AUTH.user.email || ""}}};
    const r = await fetch(fsDoc() + "?updateMask.fieldPaths=data&updateMask.fieldPaths=updatedAt&updateMask.fieldPaths=email",
      {method: "PATCH", keepalive: !!keepalive, headers: {"Content-Type": "application/json", Authorization: "Bearer " + await idToken()}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error("Firestore " + r.status);
    AUTH.last = Date.now(); try { localStorage.setItem("vs.authSaved", JSON.stringify(AUTH.last)); } catch (e) {}
  } catch (e) { AUTH.dirty = true; AUTH.t = setTimeout(cloudSave, 20000); }      // try again shortly
}
function cloudDirty() {
  if (!AUTH.cfg || !AUTH.user) return;
  AUTH.dirty = true; clearTimeout(AUTH.t); AUTH.t = setTimeout(cloudSave, 2500);
}
document.addEventListener("visibilitychange", () => { if (document.hidden && AUTH.dirty) cloudSave(true); });
// account + this device -> one set of data (nothing on either side is lost)
function mergeCloud(remote) {
  if (!remote) return false;
  const before = JSON.stringify(localData());
  const J = (d, k) => { try { return JSON.parse(d[k]); } catch (e) { return null; } };
  const raw = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const local = localData();
  // keys only the account has: take them
  Object.entries(remote).forEach(([k, v]) => { if (!(k in local) && !CLOUD_SKIP.test(k)) raw(k, v); });
  const merge = (k, f) => { const a = J(localData(), "vs." + k), b = J(remote, "vs." + k); if (a != null && b != null) raw("vs." + k, JSON.stringify(f(a, b))); };
  merge("favs", (a, b) => [...new Set(b.concat(a))]);
  merge("mysubs", (a, b) => [...new Set(b.concat(a))]);
  ["favMeta", "status", "swiped", "reminders", "themeUse", "ratings"].forEach(k => merge(k, (a, b) => Object.assign({}, b, a)));
  merge("tracker", (a, b) => { const o = Object.assign({}, b, a); Object.keys(b).forEach(id => { if (a[id]) o[id] = {watched: [...new Set((a[id].watched || []).concat(b[id].watched || []))],
    notes: (a[id].notes || []).concat((b[id].notes || []).filter(n => !(a[id].notes || []).some(m => m.ts === n.ts && m.text === n.text)))}; }); return o; });
  merge("themeRecent", (a, b) => a.concat(b.filter(t => !a.some(x => x.id === t.id))).slice(0, 10));
  merge("taste", (a, b) => { const o = {t: {}, k: {}, l: {}, n: Math.max(a.n || 0, b.n || 0)};
    ["t", "k", "l"].forEach(g => [a[g] || {}, b[g] || {}].forEach(m => Object.entries(m).forEach(([k, v]) => o[g][k] = Math.max(o[g][k] || -1e9, v)))); return o; });
  return JSON.stringify(localData()) !== before;
}
// after a merge that changed this device, reload once so every screen shows the account's data
async function syncAfterSignIn() {
  let remote = null;
  try { remote = await cloudLoad(); }
  catch (e) { toast("Signed in, but couldn't reach your saved data. VibeSync keeps trying"); AUTH.t = setTimeout(syncAfterSignIn, 30000); return; }
  const changed = mergeCloud(remote);
  await cloudSave();
  if (changed) { try { sessionStorage.setItem("vs.synced", "1"); } catch (e) {} location.reload(); }
}

/* the sign-in screen */
function authGate(msg, failed) {
  const g = $("#auth"); if (!g) return;
  const inApp = IN_APP, native = inApp && window.VibeSyncApp && typeof window.VibeSyncApp.googleSignIn === "function";
  g.innerHTML = `<div class="au-in">
      <div class="au-logo">Vibe<i>Sync</i></div>
      <h1>Sign in to keep your vibe</h1>
      <p>Your Saved list, watch history, ratings, themes, reminders and subscriptions are saved to your Google account and follow you to every phone and browser.</p>
      <div class="au-btn" id="gsib">${inApp ? (native ? `<button class="au-g" data-gsi><span class="g-logo" aria-hidden="true"></span>Continue with Google</button>`
        : `<p class="au-err">Update the VibeSync app to sign in.</p><a class="btn tint" href="${APK_URL}" target="_blank" rel="noopener">📲 Get the latest app</a>`) : `<div class="au-load">Loading Google sign-in…</div>`}</div>
      ${msg ? `<p class="au-err" role="alert">${esc(msg)}</p>` : ""}
      ${failed ? `<button class="au-skip" data-authoffline>Continue without signing in for now</button>` : ""}
      <p class="au-fine">VibeSync only gets your name, email and profile picture from Google.</p></div>`;
  g.classList.add("on");
  if (!inApp) renderGoogleButton();
}
function loadGis() {
  if (AUTH.gis) return AUTH.gis;
  AUTH.gis = new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.id) return res();
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = () => res(); s.onerror = () => { AUTH.gis = null; rej(new Error("gis")); }; document.head.appendChild(s);
  });
  return AUTH.gis;
}
async function renderGoogleButton() {
  try {
    await loadGis();
    google.accounts.id.initialize({client_id: AUTH.cfg.clientId, callback: r => gotGoogleToken(r.credential), ux_mode: "popup", auto_select: false, itp_support: true});
    const box = $("#gsib"); if (!box) return;
    box.innerHTML = "";
    google.accounts.id.renderButton(box, {theme: "filled_black", size: "large", shape: "pill", text: "continue_with", logo_alignment: "left", width: Math.min(320, innerWidth - 64)});
  } catch (e) { authGate("Couldn't load Google sign-in. Check your connection and try again.", true); }
}
function nativeGoogle() {
  const b = window.VibeSyncApp, key = "g" + Date.now();
  try { b.googleSignIn(AUTH.cfg.clientId, key); } catch (e) { return authGate("Couldn't start Google sign-in.", true); }
  const btn = $("[data-gsi]"); if (btn) { btn.disabled = true; btn.lastChild.textContent = "Signing in…"; }
  let n = 0;
  const poll = setInterval(() => {
    let r = ""; try { r = b.authTake(key) || ""; } catch (e) {}
    if (!r && ++n < 400) return;
    clearInterval(poll);
    if (!r || r.startsWith("error:")) {
      const why = r.slice(6);
      authGate(/Cancel/i.test(why) ? "Sign-in was cancelled." : /NoCredential/i.test(why) ? "No Google account on this phone. Add one in Settings → Accounts, then try again."
               : "Google sign-in didn't work. Try again.", !/Cancel/i.test(why));
    } else gotGoogleToken(r);
  }, 150);
}
async function gotGoogleToken(t) {
  const g = $("#auth"); if (g) g.querySelector("#gsib").innerHTML = `<div class="au-load">Signing you in…</div>`;
  try { await firebaseSignIn(t); }
  catch (e) { return authGate(/OPERATION_NOT_ALLOWED|CONFIGURATION/i.test(e.message) ? "Google sign-in isn't switched on in Firebase yet." : "Couldn't sign you in. Try again.", true); }
  if (g) g.classList.remove("on");
  toast(`Signed in as ${AUTH.user.name || AUTH.user.email} ✓`);
  syncAfterSignIn();
}
async function authBoot() {
  if (!AUTH.cfg || AUTH.started) return;
  AUTH.started = true;
  let justSynced = false; try { justSynced = sessionStorage.getItem("vs.synced") === "1"; sessionStorage.removeItem("vs.synced"); } catch (e) {}
  if (!AUTH.user) return authGate();
  try { await idToken(); }
  catch (e) {
    if (/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED/i.test(e.message)) { saveUser(null); return authGate("Please sign in again."); }
    AUTH.offline = true; setTimeout(() => { AUTH.started = false; AUTH.offline = false; authBoot(); }, 30000); return;     // offline: keep going on this device
  }
  if (justSynced) { if (AUTH.dirty) cloudSave(); return; }
  syncAfterSignIn();                                     // pick up changes made on your other devices
}
function signOut(clear) {
  try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch (e) {}
  try { window.VibeSyncApp && window.VibeSyncApp.googleSignOut && window.VibeSyncApp.googleSignOut(); } catch (e) {}
  const save = AUTH.dirty ? cloudSave() : Promise.resolve();
  save.then(() => {
    if (clear) { const ks = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("vs.")) ks.push(k); } ks.forEach(k => localStorage.removeItem(k)); }
    AUTH.user = null; try { localStorage.removeItem("vs.auth"); } catch (e) {}
    location.reload();
  });
}
function openAccount() {
  const u = AUTH.user;
  if (!AUTH.cfg) return openXP(xpTop("Account", "") + `<div class="empty">Accounts aren't switched on for this VibeSync yet. Use 🔄 Sync to move your data between devices.</div>`, "acct");
  if (!u) return authGate();
  openXP(xpTop("Account", "") + `<div class="acct-card">${u.photo ? `<img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">` : `<span class="acct-i">${esc((u.name || u.email || "?")[0].toUpperCase())}</span>`}
      <div><b>${esc(u.name || "")}</b><small>${esc(u.email || "")}</small></div></div>
    <div class="note">☁️ Saved to your Google account${AUTH.last ? ` · last saved ${new Date(AUTH.last).toLocaleString("en-IN", {day: "numeric", month: "short", hour: "numeric", minute: "2-digit"})}` : ""}. Sign in on any phone or browser to get it all back.</div>
    <div class="acts"><button class="btn tint" data-acctsave>☁️ Save now</button><button class="btn soft" data-signout>Sign out</button></div>
    <button class="au-skip" data-signoutclear>Sign out and remove my data from this device</button>`, "acct");
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-gsi],[data-authoffline],[data-signout],[data-signoutclear],[data-acctsave],[data-account]"); if (!t) return;
  if (t.hasAttribute("data-gsi")) { nativeGoogle(); return; }
  if (t.hasAttribute("data-authoffline")) { $("#auth").classList.remove("on"); toast("Using VibeSync on this device only. Sign in any time from Saved → 👤 Account"); return; }
  if (t.hasAttribute("data-signout")) { signOut(false); return; }
  if (t.hasAttribute("data-signoutclear")) { signOut(true); return; }
  if (t.hasAttribute("data-acctsave")) { cloudSave().then(() => { toast("Saved to your account ☁️"); openAccount(); }); return; }
  if (t.hasAttribute("data-account")) { openAccount(); return; }
});

/* ───────────── boot ───────────── */
function boot(data) {
  if (D) return;
  D = data; D.items.forEach(i => BY[i.id] = i);
  D.providers.sunnxt = D.providers.sunnxt || {name: "Sun NXT", color: "#F58220", pkg: "com.suntv.sunnxt"};   // older cached catalogues
  D.featured = pickFeatured();
  T.key = (args.tmdbKey || new URLSearchParams(location.search).get("tmdb") || "").trim();
  Object.values(store.get("favMeta", {})).forEach(m => { if (!BY[m.id]) BY[m.id] = rehydrate(m); });
  rehydrateAll();
  OMDB.key = (args.omdbKey || "").trim();
  applyTheme("cinema", false);                   // the four fixed looks are gone; title themes replace them
  render(); fillLive(document); fitHeight();
  applyTitle(TT.cur, true);
  if (T.key) ensureProviders();
  setTimeout(() => { syncWidgetWatched(); checkReminders(); pushWidget(); openFromApp(); }, 1200);
  setAuthConfig(args.firebase); authBoot();
}
window.addEventListener("message", e => {
  const m = e.data;
  if (!m || m.type !== "streamlit:render") return;
  args = m.args || {};
  if (args.ytKey) YTS.key = String(args.ytKey).trim();
  if (args.omdbKey) OMDB.key = String(args.omdbKey).trim();
  if (args.firebase && D && !AUTH.cfg) { setAuthConfig(args.firebase); authBoot(); }
  if (args.langs && typeof args.langs === "object" && D) gotServerLangs(args.langs);
  if (args.catalog) boot(args.catalog);
  if (args.resolved && typeof args.resolved === "object") {
    let fresh = false;
    Object.entries(args.resolved).forEach(([k, v]) => { if (!RESOLVED[k] || !Object.keys(RESOLVED[k]).length) { RESOLVED[k] = v || {}; fresh = true; } });
    if (fresh && openId && BY[openId] && BY[openId].tmdb) refreshSheet();
  }
  if (D && args.tmdbKey && !T.key) { T.key = args.tmdbKey.trim(); setTab(state.tab); }
  else if (!D) fetch("catalog.json").then(r => r.json()).then(boot).catch(e => console.error("VibeSync boot:", e && e.stack || e));
  fitHeight();
});
send("streamlit:componentReady", {apiVersion: 1});
// Standalone fallback (opened directly, or if the render message never arrives)
setTimeout(() => { if (!D) fetch("catalog.json").then(r => r.json()).then(boot).catch(e => console.error("VibeSync boot:", e && e.stack || e)); }, 900);
fitHeight();
})();
</script>
