<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VibeSync Discover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* ═══ VibeSync · "Midnight show" ═══════════════════════════════════════════════
   One family (Archivo) on its width axis: Expanded + heavy for titles, normal for text.
   The page has no fixed accent: --tint follows whatever title is in the spotlight. */
@property --tint{syntax:"<color>";inherits:true;initial-value:#FFB547}
:root,[data-theme="cinema"]{
  --bg:#0D0A12; --s1:#17131E; --s2:#221C2B; --s3:#2E2639; --line:rgba(246,242,236,.08);
  --text:#F6F2EC; --muted:#A69EB0; --accent:#FFB547; --on-tint:#1A1208; --hot:#FF4D5E;
  --scrim:rgba(13,10,18,0); --glass:rgba(23,19,30,.72);
}
[data-theme="daylight"]{
  --bg:#F6F3EE; --s1:#FFFFFF; --s2:#EDE7DF; --s3:#E2DBD1; --line:rgba(30,26,23,.1);
  --text:#1D1916; --muted:#6E655D; --accent:#0F766E; --on-tint:#FFFFFF; --hot:#E11D48;
  --scrim:rgba(246,243,238,0); --glass:rgba(255,255,255,.78);
}
[data-theme="deepsea"]{
  --bg:#05161B; --s1:#0B232A; --s2:#123039; --s3:#183C46; --line:rgba(230,244,241,.08);
  --text:#E8F5F2; --muted:#8FB3AC; --accent:#5EE6B8; --on-tint:#03231A; --hot:#FF6B6B;
  --scrim:rgba(5,22,27,0); --glass:rgba(11,35,42,.74);
}
[data-theme="mono"]{
  --bg:#000; --s1:#111; --s2:#1C1C1C; --s3:#272727; --line:rgba(255,255,255,.1);
  --text:#fff; --muted:#9A9A9A; --accent:#FFFFFF; --on-tint:#000; --hot:#FF453A;
  --scrim:rgba(0,0,0,0); --glass:rgba(17,17,17,.76);
}
:root{--tint:var(--accent);transition:--tint 1.1s ease;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,1.5,.4,1)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-variation-settings:"wdth" 100;
  transition:background-color .45s,color .45s;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
:focus-visible{outline:2px solid var(--tint);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wide{font-variation-settings:"wdth" 125}

.ambient{position:fixed;inset:0 0 auto 0;height:90vh;pointer-events:none;z-index:0;
  background:radial-gradient(90% 60% at 50% 0%,color-mix(in srgb,var(--tint) 30%,transparent),transparent 70%)}
#app{position:relative;z-index:1;height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding-bottom:112px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ── Top bar (glass once you scroll) ── */
.top{position:sticky;top:0;z-index:12;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 18px;
  transition:background-color .3s,backdrop-filter .3s,box-shadow .3s}
.top.solid{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 var(--line)}
.mark{font-weight:900;font-size:22px;letter-spacing:-.03em;font-variation-settings:"wdth" 125}
.mark i{font-style:normal;color:var(--tint)}
.tools{display:flex;gap:4px}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .15s,background-color .2s}
.icon:active{transform:scale(.9)}
@media (hover:hover){.icon:hover{background:color-mix(in srgb,var(--text) 10%,transparent)}}
.icon svg,.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── Hero: story-style spotlight ── */
.hero{position:relative;margin-top:-60px;padding-top:60px;min-height:min(150vw,640px);overflow:hidden;isolation:isolate}
.hbd{position:absolute;inset:-60px;background-size:cover;background-position:center 30%;filter:blur(36px) saturate(1.5);
  transform:scale(1.25);opacity:0;transition:opacity 1s ease;will-change:opacity}
.hbd.on{opacity:.85}
.hero::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 35%,transparent) 0%,var(--scrim) 28%,color-mix(in srgb,var(--bg) 70%,transparent) 66%,var(--bg) 100%)}
.bars{position:absolute;z-index:3;top:64px;left:18px;right:18px;display:flex;gap:5px}
.bars i{flex:1;height:3px;border-radius:3px;background:color-mix(in srgb,var(--text) 25%,transparent);overflow:hidden}
.bars b{display:block;height:100%;width:0;background:var(--text)}
.bars i.done b{width:100%}
.bars i.run b{animation:fill var(--dur,7s) linear forwards}
.paused .bars i.run b{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.slides{position:relative;z-index:2;display:grid;will-change:transform,opacity}
.slide{grid-area:1/1;padding:34px 18px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;
  opacity:0;pointer-events:none;visibility:hidden;transition:opacity .6s ease,visibility 0s .6s}
.slide.on{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .6s ease}
.htx{min-width:0;display:flex;flex-direction:column;align-items:inherit}
.hp{display:block;width:min(54vw,240px);transform:translateY(18px) scale(.94) rotate(-1.5deg);opacity:0;
  transition:transform .9s var(--ease),opacity .7s;filter:drop-shadow(0 26px 40px color-mix(in srgb,var(--tint) 30%,rgba(0,0,0,.55)))}
.slide.on .hp{transform:none;opacity:1}
.hp .pw{border-radius:16px}
.hk{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:20px 0 8px;font-size:14px;color:var(--muted)}
.ht{margin:0;font-weight:850;font-variation-settings:"wdth" 125;font-size:clamp(30px,9.2vw,62px);line-height:.92;letter-spacing:-.03em;
  text-wrap:balance;max-width:16ch;transform:translateY(10px);opacity:0;transition:transform .8s .08s var(--ease),opacity .7s .08s}
.slide.on .ht{transform:none;opacity:1}
.hs{font-size:15px;line-height:1.45;opacity:.84;margin:12px auto 18px;max-width:44ch;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px;
  transition:transform .15s,filter .2s,background-color .45s,box-shadow .3s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn svg{width:18px;height:18px;fill:currentColor;stroke:none}
.btn.tint{background:var(--tint);color:var(--on-tint);box-shadow:0 10px 30px color-mix(in srgb,var(--tint) 40%,transparent)}
.btn.glass{background:color-mix(in srgb,var(--text) 14%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.soft{background:var(--s2)}
.btn.round{width:48px;padding:0}
@media (max-width:759px){.btn.dt{width:48px;padding:0}.btn.dt span{display:none}}
.btn svg circle[fill=none],.btn svg path[stroke]{fill:none!important;stroke:currentColor!important}
.btn[aria-pressed="true"] svg,.btn.saved svg{fill:var(--hot)}
.surprise .go svg{width:22px;height:22px}
@media (hover:hover){.btn.tint:hover{filter:brightness(1.06)}}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--hot);color:#fff;font-weight:700;font-size:12px;padding:4px 10px;border-radius:99px;letter-spacing:.01em}
.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.sc{color:var(--tint);font-weight:700}

/* ── Sections ── */
.sec{margin:30px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;font-variation-settings:"wdth" 112}
.sec p{margin:0;color:var(--muted);font-size:14px;white-space:nowrap}
.live-sub{display:inline-flex;align-items:center;gap:6px}.live-sub i{width:7px;height:7px;border-radius:50%;background:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 25%,transparent)}

/* ── Mood tiles ── */
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:104px;gap:10px;overflow-x:auto;padding:4px 18px 10px;margin:0 -18px;scrollbar-width:none;scroll-snap-type:x proximity}
.tiles::-webkit-scrollbar{display:none}
.tile{scroll-snap-align:start;position:relative;height:112px;border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,var(--m1),var(--m2));color:#140F1C;overflow:hidden;
  transition:transform .3s var(--spring),box-shadow .3s}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0 var(--text);transition:box-shadow .25s}
.tile .e{font-size:36px;line-height:1;transition:transform .45s var(--spring)}
.tile b{font-size:14px;font-weight:800;line-height:1.1}
.tile:active{transform:scale(.94)}
.tile[aria-pressed="true"]{transform:translateY(-4px);box-shadow:0 14px 30px color-mix(in srgb,var(--m1) 45%,transparent)}
.tile[aria-pressed="true"]::after{box-shadow:inset 0 0 0 3px var(--text)}
.tile[aria-pressed="true"] .e{transform:scale(1.18) rotate(-8deg)}
.moodbox{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.moodbox.open{grid-template-rows:1fr}
.moodbox>div{overflow:hidden;margin:0 -18px;padding:0 18px}
.moodline{font-size:15px;color:var(--muted);margin:10px 0 0}

/* ── Surprise card ── */
.surprise{position:relative;display:flex;align-items:center;gap:16px;width:100%;margin:18px 0 0;padding:16px 18px;border-radius:22px;text-align:left;overflow:hidden;
  background:linear-gradient(120deg,color-mix(in srgb,var(--tint) 26%,var(--s1)),var(--s1) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 30%,transparent);
  transition:transform .15s}
.surprise:active{transform:scale(.98)}
.surprise .die{font-size:40px;line-height:1;transition:transform .6s var(--spring)}
.surprise:active .die{transform:rotate(-220deg) scale(.9)}
.surprise b{display:block;font-size:20px;font-weight:850;letter-spacing:-.02em;font-variation-settings:"wdth" 118}
.surprise small{display:block;font-size:14px;color:var(--muted);margin-top:2px}

/* ── Tracker widget ── */
.trkw{display:flex;align-items:center;gap:14px;margin-top:12px;padding:12px;border-radius:20px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);text-align:left;width:100%}
.trkw .pw{width:54px;flex:0 0 auto;border-radius:10px}
.trkw .tx{min-width:0;flex:1}
.trkw b{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:750}
.trkw .live{font-size:11px;padding:3px 8px}
.trkw small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trkw small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.trkw .go{flex:0 0 auto;height:38px;padding:0 14px;border-radius:99px;background:var(--s2);font-size:14px;font-weight:700;display:grid;place-items:center}

/* ── Category tabs: sticky, with a sliding pill ── */
.tabs{position:sticky;top:60px;z-index:8;margin:26px -18px 0;padding:8px 18px;background:var(--bg);transition:background-color .45s}
.tabs.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tabrow{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px;border-radius:999px;background:var(--s1)}
.tabrow::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;flex:0 0 auto;height:38px;padding:0 15px;border-radius:999px;font-size:15px;font-weight:650;color:var(--muted);transition:color .3s}
.tab[aria-selected="true"]{color:var(--bg)}
.pill{position:absolute;z-index:0;top:3px;left:0;height:38px;border-radius:999px;background:var(--text);
  transition:transform .45s var(--spring),width .45s var(--spring)}
.panel{animation:panelIn .42s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:translateX(var(--dir,20px))}to{opacity:1;transform:none}}

/* ── Rows & cards ── */
.row{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(124px,31vw,172px);gap:12px;overflow-x:auto;
  padding:2px 18px 10px;margin:0 -18px;scroll-snap-type:x proximity;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(124px,29vw,172px),1fr));gap:18px 12px}
.card{scroll-snap-align:start;text-align:left;display:block;width:100%;min-width:0}
.pw{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--s2);
  transition:transform .3s var(--ease),box-shadow .3s;box-shadow:0 0 0 1px var(--line)}
.card:active .pw{transform:scale(.95)}
@media (hover:hover){.card:hover .pw{transform:translateY(-5px);box-shadow:0 18px 34px rgba(0,0,0,.4),0 0 0 1px var(--line)}}
.pw img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.pw img.ok{opacity:1}
.art{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(150deg,var(--c1),var(--c2))}
.art span{font-size:50px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.badge{position:absolute;top:8px;left:8px;z-index:2}
.provs{position:absolute;left:7px;bottom:7px;z-index:2;display:flex;gap:4px}
.pc{font-style:normal;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;background:var(--pcol);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pd{width:10px;height:10px;border-radius:50%}
.ns{position:absolute;left:7px;right:7px;bottom:7px;z-index:2;font-size:11px;font-weight:650;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.66);color:#fff;text-align:center}
.heart{position:absolute;top:7px;right:7px;z-index:2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.5)}
.heart svg{width:15px;height:15px;fill:var(--hot)}
.ct{font-weight:650;font-size:15px;line-height:1.2;margin:9px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:flex;gap:10px;font-size:13px;color:var(--muted);margin:0 2px}
.sk .pw{background:linear-gradient(100deg,var(--s1) 30%,var(--s2) 50%,var(--s1) 70%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}
.sk-t{height:12px;width:70%;border-radius:6px;background:var(--s1);margin:11px 2px 0}
@keyframes shimmer{to{background-position:-150% 0}}
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;font-size:15px;line-height:1.5}

/* Top 10: giant outlined ranks */
.top10{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(170px,48vw,230px);gap:4px;overflow-x:auto;padding:2px 18px 10px;margin:0 -18px;scrollbar-width:none;scroll-snap-type:x proximity}
.top10::-webkit-scrollbar{display:none}
.t10{scroll-snap-align:start;display:flex;align-items:flex-end;text-align:left}
.t10 .n{flex:0 0 auto;width:46%;margin-right:-12%;font-weight:900;font-variation-settings:"wdth" 70;font-size:clamp(118px,34vw,170px);line-height:.78;letter-spacing:-.06em;
  color:var(--bg);-webkit-text-stroke:2.5px color-mix(in srgb,var(--text) 55%,transparent);text-align:right;user-select:none;transition:-webkit-text-stroke-color .3s}
.t10 .n.wide2{font-size:clamp(96px,28vw,140px)}
.t10 .pw{flex:1;min-width:0}
.t10:active .pw{transform:scale(.95)}
@media (hover:hover){.t10:hover .n{-webkit-text-stroke-color:var(--tint)}}

/* chips (platforms) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:42px;padding:0 16px;border-radius:999px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;transition:background-color .25s,color .25s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
#platbox{margin-top:4px}
.checking{display:flex;align-items:center;gap:10px;padding:16px;border-radius:16px;background:var(--s2);color:var(--muted);font-size:15px}
.checking i{width:10px;height:10px;border-radius:50%;background:var(--tint);animation:pulse 1s infinite}
.plogo{width:38px;height:38px;border-radius:11px;object-fit:cover;flex:0 0 auto}

/* ── Detail sheet ── */
.veil{position:fixed;inset:0;z-index:26;background:rgba(0,0,0,.6);opacity:0;transition:opacity .35s;pointer-events:none}
.veil.on{opacity:1;pointer-events:auto}
.sheet{--st:var(--accent);position:fixed;z-index:27;left:0;right:0;bottom:0;background:var(--s1);border-radius:26px 26px 0 0;
  max-height:94%;display:flex;flex-direction:column;overflow:hidden;visibility:hidden;transform:translateY(105%)}
.sheet.on{visibility:visible;transform:none}
.grab{position:absolute;z-index:4;top:0;left:0;right:0;height:28px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:44px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--text) 35%,transparent)}
.x{position:absolute;top:12px;right:12px;z-index:5;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sbody{overflow-y:auto;overscroll-behavior:contain;flex:1 1 auto;min-height:0;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.shero{position:relative;padding:44px 20px 22px;overflow:hidden;isolation:isolate}
.sbd{position:absolute;inset:-50px;z-index:-1;background-size:cover;background-position:center 25%;filter:blur(40px) saturate(1.5);transform:scale(1.2);opacity:.7}
.shero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,color-mix(in srgb,var(--st) 20%,transparent),var(--s1) 96%)}
.shead{display:flex;gap:18px;align-items:flex-end}
.shead .pw{width:128px;flex:0 0 auto;border-radius:14px;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.stitle{margin:0 0 10px;font-weight:850;font-variation-settings:"wdth" 120;font-size:28px;line-height:.98;letter-spacing:-.025em;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--text) 10%,transparent)}
.fact.sc{background:color-mix(in srgb,var(--st) 22%,transparent);color:var(--text)}
.sin{padding:0 20px}
.sin>*{animation:rise .5s var(--ease) both}
.sin.still>*{animation:none}
.sin>*:nth-child(2){animation-delay:.04s}.sin>*:nth-child(3){animation-delay:.08s}.sin>*:nth-child(4){animation-delay:.12s}.sin>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:13px;padding:6px 12px;border-radius:99px;background:var(--s2)}
.tag.tel{background:color-mix(in srgb,var(--st) 25%,var(--s2))}
.syn{font-size:16px;line-height:1.6;margin:16px 0 0;max-width:62ch;color:color-mix(in srgb,var(--text) 88%,transparent)}
.h3{font-size:15px;font-weight:800;margin:26px 0 12px;letter-spacing:-.01em;font-variation-settings:"wdth" 112}
.offers{display:grid;gap:10px}
.offer{--pcol:#666;display:flex;align-items:center;gap:14px;padding:12px 12px 12px 12px;border-radius:18px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--pcol) 22%,var(--s2)),var(--s2) 75%);transition:transform .15s}
.offer:active{transform:scale(.98)}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;background:var(--pcol);flex:0 0 auto}
.offer b{font-size:16px;font-weight:700}
.offer small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.offer .go{margin-left:auto;flex:0 0 auto;height:38px;padding:0 16px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;background:var(--pcol);color:#fff;font-weight:800;font-size:14px}
.offer .go svg{width:14px;height:14px;fill:currentColor}
.note{font-size:14px;line-height:1.5;color:var(--muted);background:var(--s2);border-radius:14px;padding:12px 14px;margin-top:10px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sheet .btn.tint{background:var(--st);box-shadow:0 10px 28px color-mix(in srgb,var(--st) 35%,transparent)}
.trk .btn.soft{background:var(--s1)}
.saved svg{fill:var(--hot)}
.pop{animation:pop .4s var(--spring)}
@keyframes pop{40%{transform:scale(1.35)}}
.foot2{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.5}
.fly{position:fixed;z-index:28;transform-origin:0 0;pointer-events:none;border-radius:14px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.5)}

/* tracker inside the sheet */
.trk{background:var(--s2);border-radius:18px;padding:14px}
.trk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.trk-n{font-size:14px;color:var(--muted)}
.trk-n b{font-size:26px;color:var(--text);font-weight:850;margin-right:6px;font-variation-settings:"wdth" 120}
.form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.form input,.form select{height:44px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--s1);color:var(--text);padding:0 12px;font:inherit;font-size:15px}
.form input{flex:1 1 200px;min-width:0}
.upd{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.upd:first-of-type{border-top:0}
.upd .d{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px;min-width:72px}
.upd .t{font-size:12px;font-weight:800;color:var(--st);margin-right:6px}
.upd button{margin-left:auto;color:var(--muted);font-size:13px;padding:2px 6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ── Search ── */
.search{position:fixed;inset:0;z-index:25;background:var(--bg);opacity:0;pointer-events:none;transform:scale(1.02);
  transition:opacity .25s,transform .3s var(--ease);display:flex;flex-direction:column}
.search.on{opacity:1;transform:none;pointer-events:auto}
.sbar{display:flex;gap:10px;align-items:center;padding:12px 14px 8px 18px;max-width:1180px;width:100%;margin:0 auto}
.sfield{flex:1;position:relative}
.sfield svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.sfield input{width:100%;height:52px;border-radius:16px;border:0;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);color:var(--text);padding:0 16px 0 46px;font:inherit;font-size:17px}
.sfield input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--tint)}
.sres{overflow-y:auto;flex:1;padding:4px 0 40px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* ── Surprise reel ── */
.reel{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .25s}
.reel.on{opacity:1;pointer-events:auto}
.reel-in{width:100%;text-align:center}
.reel-win{position:relative;overflow:hidden;padding:18px 0}
.reel-win::before,.reel-win::after{content:"";position:absolute;top:0;bottom:0;width:26%;z-index:2;pointer-events:none}
.reel-win::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.reel-win::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.frame{position:absolute;z-index:3;left:50%;top:10px;bottom:10px;width:136px;transform:translateX(-50%);border-radius:20px;
  box-shadow:0 0 0 3px var(--tint),0 0 40px color-mix(in srgb,var(--tint) 60%,transparent)}
.reel-strip{display:flex;gap:12px;will-change:transform}
.reel-strip .pw{flex:0 0 120px}
.reel-cap{margin-top:16px;font-weight:850;font-size:24px;letter-spacing:-.02em;font-variation-settings:"wdth" 120;padding:0 20px}
.reel-sub{color:var(--muted);font-size:14px;margin-top:4px}

/* ── Look picker ── */
.pop-menu{position:fixed;z-index:29;top:58px;right:12px;background:var(--s1);border-radius:20px;padding:10px;width:236px;
  box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 0 0 1px var(--line);transform-origin:top right;transform:scale(.9);opacity:0;pointer-events:none;
  transition:transform .3s var(--spring),opacity .2s}
.pop-menu.on{transform:none;opacity:1;pointer-events:auto}
.pop-menu h4{margin:6px 8px 8px;font-size:14px;color:var(--muted);font-weight:650}
.sw{display:flex;align-items:center;gap:12px;width:100%;padding:9px 8px;border-radius:12px;font-size:15px;font-weight:650}
.sw[aria-checked="true"]{background:var(--s2)}
.sw i{width:30px;height:30px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 2px rgba(128,128,128,.35)}

/* ── Bottom tab bar ── */
.bnav{position:fixed;z-index:15;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:0 -1px 0 var(--line)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--muted);padding:4px 0;transition:color .25s,transform .15s}
.bnav button:active{transform:scale(.9)}
.bnav button[aria-current="page"]{color:var(--text)}
.bnav button[aria-current="page"] svg{stroke:var(--tint)}
.bdice{justify-self:center;width:60px;height:60px;margin-top:-30px;border-radius:50%!important;display:grid!important;place-items:center;font-size:28px!important;
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,#fff 35%,var(--tint)),var(--tint) 60%);color:var(--on-tint)!important;
  box-shadow:0 10px 28px color-mix(in srgb,var(--tint) 55%,transparent),0 0 0 5px var(--bg)}
.bdice.spin{animation:spin .7s var(--spring)}
@keyframes spin{to{transform:rotate(360deg)}}

.foot{margin:36px 0 0;font-size:12px;color:var(--muted);line-height:1.6;max-width:70ch}
.toast{position:fixed;left:50%;bottom:104px;z-index:40;transform:translate(-50%,16px);opacity:0;background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;transition:all .35s var(--spring);pointer-events:none;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}

@media (min-width:760px){
  .top{padding:0 max(14px,calc((100vw - 1180px)/2 + 8px)) 0 max(18px,calc((100vw - 1180px)/2 + 18px))}
  .hero{min-height:560px}
  .slide{flex-direction:row;align-items:flex-end;text-align:left;gap:34px;padding:60px max(18px,calc((100vw - 1180px)/2 + 18px)) 40px}
  .hp{width:230px}
  .hk,.btns{justify-content:flex-start}
  .htx{align-items:flex-start;flex:1}
  .hs{margin-left:0}
  .ht{max-width:14ch}
  .bars{left:max(18px,calc((100vw - 1180px)/2 + 18px));right:max(18px,calc((100vw - 1180px)/2 + 18px))}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(780px,92vw);height:auto;max-height:88%;border-radius:26px;transform:translate(-50%,-50%)}
  .sheet.on{transform:translate(-50%,-50%)}
  .grab{display:none}
  .shero{padding:34px 30px 24px}.sin{padding:0 30px}

  .bnav{left:50%;right:auto;bottom:16px;width:440px;transform:translateX(-50%);border-radius:26px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 0 0 1px var(--line)}
  .toast{bottom:110px}
}
/* In a browser on streamlit.app, Streamlit pins its own badges to the bottom-right corner:
   float the tab bar above them so every tab stays tappable. (The Android app hides those badges.) */
@media (max-width:759px){
  .cloud #app{padding-bottom:180px}
  .cloud .bnav{left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));padding:8px 6px 10px;border-radius:26px;
    box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 0 0 1px var(--line)}
  .cloud .toast{bottom:170px}
}
/* ── Title themes: the 3D world behind the UI ── */
.world{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease;overflow:hidden;perspective:900px}
.titled .world{opacity:1}
.titled .ambient{opacity:0}
.w-far,.w-near{position:absolute;background-size:cover;background-position:center 30%;will-change:transform;transition:background-image .6s}
.w-far{inset:-10%;filter:blur(2px) saturate(1.15);opacity:.62;
  transform:translate3d(var(--px,0px),calc(var(--py,0px) + var(--sy,0px)),0) scale(1.1)}
.w-near{left:-12%;right:-12%;top:-6%;height:78%;opacity:.55;filter:saturate(1.25) contrast(1.05);
  -webkit-mask-image:radial-gradient(65% 60% at 50% 42%,#000 25%,transparent 72%);mask-image:radial-gradient(65% 60% at 50% 42%,#000 25%,transparent 72%);
  transform:translate3d(calc(var(--px,0px) * -2.2),calc(var(--py,0px) * -2.2 + var(--sy,0px) * 2.4),60px) scale(1.04)}
#wfx{position:absolute;inset:0;width:100%;height:100%}
.w-shade{position:absolute;inset:0;
  background:radial-gradient(130% 75% at 50% 0%,transparent 0%,color-mix(in srgb,var(--bg) 45%,transparent) 50%,color-mix(in srgb,var(--bg) 88%,transparent) 100%),
             linear-gradient(180deg,color-mix(in srgb,var(--bg) 10%,transparent) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 45%,color-mix(in srgb,var(--bg) 82%,transparent) 100%)}
.titled .hbd.on{opacity:.14}
.titled .tile{background:linear-gradient(150deg,color-mix(in srgb,var(--m1) 30%,var(--accent)),color-mix(in srgb,var(--m2) 30%,var(--accent2)));color:var(--on-tint)}
.titled .mixcard{background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--accent2)) 55%,var(--accent2));color:var(--on-tint);
  box-shadow:0 18px 40px color-mix(in srgb,var(--accent) 30%,transparent)}
.titled .mxchip{background:linear-gradient(120deg,var(--accent),var(--accent2));color:var(--on-tint)}
.titled .surprise{background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%,var(--s1)),color-mix(in srgb,var(--s1) 80%,transparent) 70%)}
.titled .trkw,.titled .chip,.titled .tabrow{background:color-mix(in srgb,var(--s1) 90%,transparent)}
.titled .tabs{background:transparent}
.titled .tabs.glass{background:var(--glass)}
.titled .pw{box-shadow:0 0 0 1px var(--line),0 12px 30px color-mix(in srgb,var(--accent) 14%,transparent)}
.titled .sec h2,.titled .ht,.titled .mark{text-shadow:0 2px 22px color-mix(in srgb,var(--bg) 85%,transparent)}
.titled .tile{box-shadow:0 10px 26px color-mix(in srgb,var(--bg) 60%,transparent)}
.tthumb{width:32px;height:32px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--accent),0 0 18px color-mix(in srgb,var(--accent) 60%,transparent)}
.tflash{position:fixed;inset:0;z-index:45;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;background:#000;
  animation:tfIn .45s ease both;overflow:hidden}
.tflash.out{animation:tfOut .7s ease both}
.tf-bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(40px) saturate(1.6) brightness(.7);animation:tfZoom 2.2s ease both}
.tf-p{position:relative;width:min(46vw,220px);filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.tf-p .pw{border-radius:18px}
.tf-t{position:relative;font-weight:900;font-variation-settings:"wdth" 125;font-size:clamp(26px,7vw,44px);letter-spacing:-.03em;color:#fff;padding:0 20px;
  animation:rise .6s .3s var(--ease) both}
.tf-s{position:relative;color:rgba(255,255,255,.75);font-size:15px;animation:rise .6s .45s var(--ease) both}
@keyframes tfIn{from{opacity:0}}
@keyframes tfOut{to{opacity:0;transform:scale(1.06)}}
@keyframes tfZoom{from{transform:scale(1.3)}to{transform:scale(1)}}
.tcur{display:flex;align-items:center;gap:14px;margin:12px 0 4px;padding:14px;border-radius:22px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 22%,var(--s1)),var(--s1) 75%);box-shadow:inset 0 0 0 1px var(--line)}
.tcur img{width:54px;height:80px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.tcur-i{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--s2);flex:0 0 auto}
.tcur>div{flex:1;min-width:0}
.tcur small{display:block;color:var(--muted);font-size:13px}
.tcur b{display:block;font-size:19px;font-weight:850;letter-spacing:-.01em;margin:2px 0}
.tfx{display:block;font-size:13px;color:var(--muted)}
.tchip{padding-left:6px}
.tchip img{width:30px;height:30px;border-radius:50%;object-fit:cover}

/* ── Title worlds: whole-app treatments ── */
.w-fog,.w-grid,.w-waves,.w-spot,.w-vines,.w-webs{display:none;position:absolute;pointer-events:none}
#piles{position:fixed;inset:0;z-index:14;pointer-events:none}
#ffx{position:fixed;inset:0;width:100%;height:100%;z-index:13;pointer-events:none}
/* ── Creatures and what they do to the app ── */
#cfx{position:fixed;inset:0;width:100%;height:100%;z-index:14;pointer-events:none}
#critters{position:fixed;inset:0;z-index:14;pointer-events:none;overflow:hidden}
.critter{position:absolute;left:0;top:0;line-height:1;will-change:transform;transition:opacity .4s;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.critter b{display:block;font-weight:400;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif;transform-origin:50% 60%}
.mv-fly b,.mv-buzz b{animation:flap .26s ease-in-out infinite alternate}
.mv-flutter b{animation:flap .48s ease-in-out infinite alternate}
.mv-buzz b{animation-duration:.08s}
.critter.rest b{animation:none}
.critter.blink b{animation:blinkEye .3s ease-in-out}
.critter.letter{font-size:24px}
@keyframes flap{to{scale:1 .74}}
@keyframes blinkEye{50%{scale:1 .08}}
.titled :is(.pw,.sec h2,.tile,.mixcard,.surprise){transition:transform .7s var(--spring),filter 1.4s ease,opacity .6s,box-shadow .6s}
.vs-burn{animation:burnShake .09s linear infinite!important;filter:sepia(1) saturate(3.2) hue-rotate(-22deg) brightness(1.15) contrast(1.2)!important;
  box-shadow:0 0 30px #ff6a00,0 0 70px #ff3d00aa!important}
.pw.vs-burn::after{content:"";position:absolute;inset:-6% -2% 0;z-index:6;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(34% 55% at 22% 100%,#ffd36bee,transparent 70%),radial-gradient(30% 70% at 50% 100%,#ff7a1aee,transparent 70%),
    radial-gradient(34% 52% at 80% 100%,#ffb02eee,transparent 70%),radial-gradient(60% 40% at 50% 100%,#ff3d00cc,transparent 75%);
  animation:flames .32s ease-in-out infinite alternate}
.sec h2.vs-burn,.vs-burn :is(b){color:#ffc46b!important;text-shadow:0 0 8px #ff6a00,0 -6px 16px #ff3d00,0 -14px 26px #ffae00!important}
@keyframes flames{from{transform:scaleY(.82) translateY(4%)}to{transform:scaleY(1.12) translateY(-3%)}}
@keyframes burnShake{0%{translate:0 0}25%{translate:1px -1px}50%{translate:-1px 1px}75%{translate:1px 1px}}
.vs-charred{filter:grayscale(.7) brightness(.42) contrast(1.35) sepia(.5)!important}
.vs-flip{transform:rotate(180deg)!important}
.pw.vs-web::after{content:"🕸️";position:absolute;inset:0;z-index:6;display:grid;place-items:center;font-size:110px;opacity:.85;pointer-events:none;
  filter:grayscale(1) brightness(1.9);animation:popIn .5s var(--spring) both;font-family:"Noto Color Emoji",sans-serif}
.sec h2.vs-web::after{content:"🕸️"!important}
.vs-lift{transform:translateY(-16px) scale(1.05)!important;box-shadow:0 0 0 2px #a0ffdc,0 0 50px #a0ffdc!important}
.vs-phase{opacity:.22!important;filter:blur(1.5px) hue-rotate(160deg)!important}
.vs-glow{box-shadow:0 0 0 3px #ffd36b,0 0 46px #ffd36bcc!important}
.vs-sink{transform:translateY(40px) scale(.82) rotate(-6deg)!important;opacity:.15!important}
.vs-squash{animation:squash .45s var(--spring)!important}
@keyframes squash{30%{scale:1.08 .84}60%{scale:.96 1.05}}
.vs-shake{animation:shake2 .7s ease!important}

#piles i{position:absolute;font-style:normal;font-size:30px;rotate:var(--r);filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));animation:bob 4s ease-in-out infinite;animation-delay:var(--d)}

  const twin = it.tmdb && curatedTwin(it);
  if (twin) { it = twin; id = twin.id; }          // we have hand-checked exact links for this one
  if (it.tmdb) loadDetails(it);
  openId = id; lastFocus = from || document.activeElement; sheetStill = false;
  const sh = $("#sheet");
  sh.getAnimations().forEach(a => a.cancel());
  sh.style.transform = "";
  sh.style.setProperty("--st", tintOf(it));
  sh.innerHTML = sheetHTML(it);
  sh.querySelector(".sbody").scrollTop = 0;
  const src = from && from.querySelector && from.querySelector(".pw");
  const r = src && src.getBoundingClientRect();
  $("#veil").classList.add("on"); sh.classList.add("on");
  pauseHero(true); setTint(tintOf(it));
  if (!REDUCED) {
    if (r && r.width && r.bottom > 0 && r.top < innerHeight) flyPoster(src, r, sh.querySelector(".shead .pw"));   // measure before the sheet starts moving
    sh.animate(isMobile() ? [{translate: "0 100%"}, {translate: "0 0"}] : [{opacity: 0, scale: ".96"}, {opacity: 1, scale: "1"}],
               {duration: isMobile() ? 480 : 340, easing: EASE});
  }
  sampleTint(it).then(c => { if (openId === id) { sh.style.setProperty("--st", c); setTint(c); } });
  sh.querySelector("[data-close]").focus({preventScroll: true});
  buzz();
}
function closeSheet() {
  if (!openId) return;
  openId = null;
  const sh = $("#sheet");
  $("#veil").classList.remove("on");
  const done = () => { sh.classList.remove("on"); sh.style.transform = ""; };
  if (REDUCED) done();
  else {
    const a = sh.animate(isMobile() ? [{translate: "0 0"}, {translate: "0 110%"}] : [{opacity: 1}, {opacity: 0, scale: ".96"}],
                         {duration: 280, easing: "cubic-bezier(.4,0,1,1)", fill: "forwards"});
    a.onfinish = () => { done(); a.cancel(); };
  }
  if (!heroOff) pauseHero(false);
  setTint(tintOf(BY[D.featured[state.slide]]));
  if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll: true});
}
function refreshSheet() {
  if (!openId) return;
  const b = $("#sheet .sbody"), y = b ? b.scrollTop : 0;
  sheetStill = true; $("#sheet").innerHTML = sheetHTML(BY[openId]);
  $("#sheet .sbody").scrollTop = y;

// swipe the sheet down to close
(() => {
  let y0 = null, dy = 0;
  const sh = () => $("#sheet");
  document.addEventListener("pointerdown", e => { if (e.target.closest("[data-grab]")) { y0 = e.clientY; dy = 0; e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } });
  document.addEventListener("pointermove", e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sh().style.transform = `translateY(${dy}px)`; });
  document.addEventListener("pointerup", () => {
    if (y0 === null) return; y0 = null;
    if (dy > 90) closeSheet();
    else { const from = sh().style.transform; sh().style.transform = ""; if (!REDUCED && dy) sh().animate([{transform: from}, {transform: "none"}], {duration: 260, easing: EASE}); }
  });
})();

const QUICK = ["Anime", "Telugu", "Netflix", "JioHotstar", "Thriller", "Comedy", "Doraemon", "Reality", "Action", "Crime"];
function openSearch() {
  const s = $("#search");
  s.innerHTML = `<div class="sbar"><div class="sfield">${ICON.search}<label class="sr" for="q">Search titles</label>
    <input id="q" type="search" placeholder="Titles, genres, platforms…" autocomplete="off" enterkeyhint="search"></div>
    <button class="icon" data-closesearch aria-label="Close search">${ICON.close}</button></div><div class="sres"><div class="wrap" id="sres"></div></div>`;
  s.classList.add("on");
  setTimeout(() => $("#q").focus(), 80);
  renderSearch("");

function closeSearch() { $("#search").classList.remove("on"); }
/* Typo-tolerant search. Two signals:
   - edit distance (with swaps) against the whole title, each word and each run of leading words
   - a consonant "skeleton" (vowels and doubled letters dropped), so Indian titles match however they're
     spelled in English: bihubali / bahubali / baahubali all become "bhbl". */
const skel = s => norm(s).replace(/([bdgjkpt])h/g, "$1").replace(/[aeiouy]/g, "").replace(/(.)\1+/g, "$1");   // dh/bh/th... spellings vary
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 4) return 99;
  let p2 = null, p = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const c = [i];
    for (let j = 1; j <= b.length; j++) {
      c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (p2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) c[j] = Math.min(c[j], p2[j - 2] + 1);
    }
    p2 = p; p = c;
  }
  return p[b.length];
}
function fuzzy(q, text) {
  const nq = norm(q); if (nq.length < 3) return 0;
  const words = String(text).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  const targets = new Set([norm(text)]);
  words.forEach((w, i) => { targets.add(w); targets.add(norm(words.slice(0, i + 1).join(""))); });
  let best = 0;
  const sq = skel(q);
  for (const t of targets) {
    if (!t) continue;
    if (t.startsWith(nq) && nq.length >= 4) best = Math.max(best, .95);
    const d = lev(nq, t);
    best = Math.max(best, 1 - d / Math.max(nq.length, t.length));
    if (sq.length >= 3 && skel(t) === sq) best = Math.max(best, .9);
  }
  return best;
}
function suggestions(q, exclude) {
  const seen = new Set(), out = [];
  const pool = Object.values(BY).filter(i => i && i.title && hasPoster(i));
  pool.forEach(i => { const s = fuzzy(q, i.title); if (s >= .62 && !exclude.has(i.id)) out.push([s, i]); });
  // curated (hand-checked links) first among equals, then one card per title however it's spelt
  out.sort((a, b) => b[0] - a[0] || (!!a[1].tmdb - !!b[1].tmdb) || (scoreOf(b[1]) || 0) - (scoreOf(a[1]) || 0));
  return out.filter(([, i]) => { const k = twinKey(i.title) + "|" + (i.year || ""); return !seen.has(k) && seen.add(k); });
}
const WORDS = () => [...new Set([...Object.values(D.providers).map(p => p.name), ...D.items.flatMap(i => i.genres), "Anime", "Telugu", "Reality", "Doraemon"])];
function renderSearch(q) {
  q = q.trim().toLowerCase();
  const hay = i => (i.title + " " + i.genres.join(" ") + " " + i.offers.map(o => D.providers[o.p].name).join(" ") + " " + kindLabel(i) + (i.telugu ? " telugu" : "")).toLowerCase();
  const tq = twinKey(q);
  const items = !q ? D.items.filter(i => i.offers.length && hasPoster(i)).sort(() => Math.random() - .5).slice(0, 12)
    : D.items.filter(i => hay(i).includes(q) || (tq.length > 2 && twinKey(i.title).includes(tq)));
  const quick = !q ? `<div class="quick"><button class="chip mxchip" data-mixer>🎛️ Genre mixer</button>${QUICK.map(w => `<button class="chip" data-q="${esc(w)}">${esc(w)}</button>`).join("")}</div>` : "";
  // "Did you mean…?" when the typed text finds little, or isn't literally in the best match's title
  let dym = "", close = [];
  if (q.length >= 3) {
    const exact = items.some(i => twinKey(i.title).includes(twinKey(q)));
    const sug = suggestions(q, new Set());
    const top = sug[0];
    if (top && !exact && top[0] >= .72) {
      close = sug.slice(0, 12).map(([, i]) => i);
      const also = sug.slice(1, 4).filter(([s]) => s >= .78).map(([, i]) => i.title);
      dym = `<div class="dym"><span class="dym-i" aria-hidden="true">✨</span><div><span>Did you mean</span>
        <button class="dym-b" data-q="${esc(top[1].title)}">${esc(top[1].title)}</button><span>?</span>
        ${also.length ? `<div class="dym-also">${also.map(t => `<button class="chip" data-q="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}</div></div>`;
    } else if (!items.length) {          // maybe a misspelt platform or genre: netflx, comdy, anme...
      const w = WORDS().map(x => [fuzzy(q, x), x]).sort((a, b) => b[0] - a[0])[0];
      if (w && w[0] >= .72) {
        dym = `<div class="dym"><span class="dym-i" aria-hidden="true">✨</span><div><span>Did you mean</span>
          <button class="dym-b" data-q="${esc(w[1])}">${esc(w[1])}</button><span>?</span></div></div>`;
        close = D.items.filter(i => hay(i).includes(w[1].toLowerCase()));
      }
    }
  }
  const shown = items.length ? items : close;
  $("#sres").innerHTML = dym + (q ? section(items.length ? `${items.length} result${items.length === 1 ? "" : "s"}` : close.length ? "Closest matches" : "No results")
      : section("Try") + quick + section("You might like")) +
    (shown.length ? grid(shown) : (T.key && q ? "" : `<div class="empty">No match for “${esc(q)}”.<br>Try a genre like “anime” or a platform like “Netflix”.</div>`)) +
    (T.key && q.length > 1 ? `<div id="tsearch">${section("More titles", "")}<div class="checking"><i></i>Searching TMDB…</div></div>` : "");
  if (!items.length && close.length) $$("#sres .card").forEach((c, i) => { c.classList.add("fresh"); c.style.setProperty("--i", i); });
  // TMDB search can't fix typos, so when we've corrected one, search for the correction too
  if (T.key && q.length > 1) searchTmdb(!items.length && close.length ? close[0].title.toLowerCase() : q, shown.map(i => i.id), q);
}

/* ───────────── surprise ───────────── */
/* Truly random: the whole library (hand-picked + live titles already loaded), filtered by the
   selected mood if there is one, never repeating the last few picks. Saved titles get a small boost. */
function surprisePool() {
  const playable = i => i && hasPoster(i) && (i.offers.length || i.tmdb) && i.kind !== "sports";
  let pool = D.items.filter(playable);
  Object.values(liveState).forEach(st => st.ids.forEach(id => { const it = BY[id]; if (playable(it) && !pool.includes(it)) pool.push(it); }));
  if (state.mood) {
    const tags = new Set(D.moods[state.mood].tags);
    const moodPool = pool.filter(i => i.moods.some(t => tags.has(t)));
    if (moodPool.length >= 3) pool = moodPool;
  }
  return pool;
}
let rolling = false;
function surprise() {
  const pool = surprisePool();
  if (!pool.length || rolling) return;
  rolling = true;
  const recent = store.get("recentPicks", []);
  const keep = Math.min(15, Math.floor(pool.length / 2));
  let fresh = pool.filter(i => !recent.slice(-keep).includes(i.id));
  if (!fresh.length) fresh = pool;
  const saved = fresh.filter(i => favs.has(i.id));
  const from = saved.length && Math.random() < 0.25 ? saved : fresh;   // 1 in 4 rolls lean on your saved list
  const pick = from[Math.floor(Math.random() * from.length)];
  store.set("recentPicks", recent.concat(pick.id).slice(-30));

  rollReel(pick, pool, state.mood ? `Rolling something ${D.moods[state.mood].label.toLowerCase()}…` : "Rolling…");
}
/* The slot-machine reel: spins through `pool` and lands on `pick`, then opens its sheet. */
function rollReel(pick, pool, caption) {
  rolling = true;
  let filler = pool.filter(i => i !== pick && hasPoster(i)).sort(() => Math.random() - .5).slice(0, 16);
  while (filler.length && filler.length < 10) filler = filler.concat(filler).slice(0, 12);   // small pools still get a proper spin
  const strip = $("#strip");
  strip.innerHTML = filler.concat([pick], filler.slice(0, 3)).map(i => poster(i, "s166")).join("");
  strip.style.transition = "none"; strip.style.transform = "translateX(0)";
  $("#reelcap").textContent = caption || "Rolling…";
  $("#reelsub").textContent = "";
  $("#reel").classList.add("on");
  const dice = $(".bdice"); if (dice) { dice.classList.remove("spin"); void dice.offsetWidth; dice.classList.add("spin"); }
  const spin = REDUCED ? 0 : 1600;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const win = $(".reel-win").offsetWidth, cardW = 132, idx = filler.length;
    strip.style.transition = REDUCED ? "none" : `transform ${spin}ms cubic-bezier(.12,.75,.15,1)`;
    strip.style.transform = `translateX(${-(idx * cardW) + (win / 2 - 60)}px)`;
  }));
  setTimeout(() => {
    $("#reelcap").textContent = pick.title;
    const o = pick.offers[0];
    $("#reelsub").textContent = o ? `on ${D.providers[o.p].name}` : (scoreOf(pick) ? `★ ${scoreOf(pick).toFixed(1)}` : "");
    setTint(tintOf(pick)); buzz(20);
  }, spin);
  setTimeout(() => {
    $("#reel").classList.remove("on"); rolling = false;
    const cell = strip.children[filler.length];
    openSheet(pick.id, cell ? {querySelector: () => cell, focus: () => {}} : null);
  }, spin + 700);
}

/* scroll: glass top bar, hero parallax, pause the spotlight when it's off screen */
let heroOff = false, ticking = false;
function onScroll() {
  ticking = false;
  const sc = scroller(), y = sc.scrollTop, hero = $("#hero"), top = $("#top"), slides = $("#slides"), tabs = $("#tabs");
  if (!hero) return;
  const h = hero.offsetHeight;
  top.classList.toggle("solid", y > 24);
  document.documentElement.style.setProperty("--sy", (-y * .12).toFixed(1) + "px");
  if (!REDUCED && y < h) { slides.style.transform = `translate3d(0,${y * .32}px,0)`; slides.style.opacity = Math.max(0, 1 - y / (h * .55)); }
  const off = y > h * .7;
  if (off !== heroOff) { heroOff = off; if (!openId) pauseHero(off); }
  if (tabs) tabs.classList.toggle("glass", tabs.getBoundingClientRect().top <= 61);
}
document.addEventListener("scroll", e => { if (e.target.id === "app" && !ticking) { ticking = true; requestAnimationFrame(onScroll); } }, true);

/* ───────────── events ───────────── */
document.addEventListener("click", e => {
  const t = e.target.closest("button,a,[data-dot]");
  if (!t || !t.closest("#themes,[data-theme-btn]")) $("#themes").classList.remove("on");
  if (!t) return;
  if (t.dataset.open) { e.preventDefault(); openSheet(t.dataset.open, t); return; }
  if (t.dataset.tab) { setTab(t.dataset.tab); buzz(); return; }
  if (t.dataset.mood) { setMood(t.dataset.mood); buzz(); return; }
  if (t.dataset.plat) { showPlatform(t.dataset.plat); buzz(); return; }
  if (t.dataset.dot) { showSlide(+t.dataset.dot); startHero(); return; }
  if (t.dataset.q) { const q = $("#q"); q.value = t.dataset.q; renderSearch(q.value); return; }
  if (t.dataset.nav) {
    buzz();
    if (t.dataset.nav === "home") { if (state.tab === "saved") setTab("foryou"); scroller().scrollTo({top: 0, behavior: REDUCED ? "auto" : "smooth"}); }
    else if (t.dataset.nav === "saved") setTab("saved", true);
    else goLounge();
    return;
  }
  if (t.hasAttribute("data-mixer")) { closeSearch(); openMixer(); buzz(); return; }
  if (t.hasAttribute("data-closemixer")) { closeMixer(); return; }
  if (t.dataset.mxtype) { M.type = t.dataset.mxtype; saveMix(); renderMixer(true); buzz(); return; }
  if (t.dataset.gplus) { setGenre(+t.dataset.gplus, 1); return; }
  if (t.dataset.gminus) { setGenre(+t.dataset.gminus, -1); return; }
  if (t.dataset.mix) {
    const [, , type, ids] = MIXES[+t.dataset.mix];
    M.type = type; M.sel[type] = {}; ids.forEach(id => M.sel[type][id] = 1); saveMix();
    renderMixer(); mixBar(true); return;
  }
  if (t.hasAttribute("data-mxclear")) { M.sel[M.type] = {}; saveMix(); renderMixer(); return; }
  if (t.hasAttribute("data-mxsurprise")) { mixSurprise(); return; }
  if (t.hasAttribute("data-close")) { closeSheet(); return; }
  if (t.dataset.fav) { toggleFav(t.dataset.fav); return; }
  if (t.dataset.watch) {
    const id = t.dataset.watch, today = new Date().toISOString().slice(0, 10);
    const tr = tracker[id] || (tracker[id] = {watched: [], notes: []});
    const i = tr.watched.indexOf(today); i >= 0 ? tr.watched.splice(i, 1) : tr.watched.push(today);
    saveTracker(); refreshSheet(); buzz(); return;
  }
  if (t.dataset.del) { const [id, i] = t.dataset.del.split(":"); tracker[id].notes.splice(+i, 1); saveTracker(); refreshSheet(); return; }
  if (t.hasAttribute("data-search")) { openSearch(); return; }
  if (t.hasAttribute("data-closesearch")) { closeSearch(); return; }
  if (t.hasAttribute("data-surprise")) { surprise(); return; }
  if (t.hasAttribute("data-theme-btn")) { openThemer(); buzz(); return; }
  if (t.hasAttribute("data-closethemer")) { closeThemer(); return; }
  if (t.dataset.themeit) { e.preventDefault(); themeFrom(BY[t.dataset.themeit], t); buzz(); return; }
  if (t.hasAttribute("data-tdefault")) { TT.cur = null; store.set("titleTheme", null); applyTitle(null, true); renderThemer($("#tq").value); toast("Back to the default look"); return; }
  if (t.dataset.trecent) {
    const th = store.get("themeRecent", []).find(x => x.id === t.dataset.trecent);
    if (th) { TT.cur = th; store.set("titleTheme", th); applyTitle(th, true); closeThemer(); toast(`VibeSync is now ${th.title} ✨`); }
    return;
  }
  if (t.dataset.theme && t.classList.contains("sw")) { applyTheme(t.dataset.theme, true); buzz(); setTimeout(() => $("#themes").classList.remove("on"), 180); return; }
  if (t.tagName === "A") buzz();
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-note]"); if (!f) return;

  root.className = root.className.split(" ").filter(c => c && !c.startsWith("pk-") && c !== "titled" && c !== "has-font").join(" ");

    Object.entries({"--bg": p.bg, "--s1": p.s1, "--s2": p.s2, "--s3": p.s3, "--text": p.text, "--muted": p.muted, "--accent": p.accent,
      "--accent2": p.accent2, "--on-tint": p.onAccent, "--tint": p.accent, "--line": `color-mix(in srgb,${p.text} 9%,transparent)`,
      "--glass": `color-mix(in srgb,${p.bg} 74%,transparent)`, "--deco": JSON.stringify(pack.deco || ""), "--deco2": JSON.stringify(pack.deco2 || pack.deco || "")})
      .forEach(([k, v]) => root.style.setProperty(k, v));

    root.classList.add("titled", "pk-" + world, ...(pack.ui || "").split(" ").filter(Boolean));
    $("#wfar").style.backgroundImage = theme.far ? `url('${theme.far}')` : "";
    $("#wnear").style.backgroundImage = theme.near ? `url('${theme.near}')` : "";
    $("#piles").innerHTML = (pack.piles || []).map((g, i) => { const [x, y, r] = PILE_SPOTS[i % PILE_SPOTS.length];
      return `<i style="${x};${y};--r:${r}deg;--d:${i * .7}s">${g}</i>`; }).join("");
    startWorld(pack, p);
    startCritters(Object.assign({}, theme, {world}));
  }
  themeBtn();
  if (tell) {
    const p = theme && theme.pal;
    send("streamlit:setComponentValue", {value: {theme: "cinema", n: Date.now(), palette: p ? {bg: p.bg, s1: p.s1, s2: p.s2, text: p.text, muted: p.muted,
      accent: p.accent, on_accent: p.onAccent, hot: p.hot} : null}, dataType: "json"});
  }
}

  fish:    {g: "🐟", size: [26, 32], move: "jump", habit: "splash", every: [4, 8]},
  dolphin: {g: "🐬", size: [34, 40], move: "jump", habit: "splash", every: [7, 12]},

      if (p.k === "beam") { const g = ctx.createLinearGradient(0, p.y * dpr, 0, p.y2 * dpr); g.addColorStop(0, "rgba(160,255,220,.55)"); g.addColorStop(1, "rgba(160,255,220,.05)");
        ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo((p.x - 8) * dpr, p.y * dpr); ctx.lineTo((p.x + 8) * dpr, p.y * dpr);
        ctx.lineTo((p.x2 + p.w / 2) * dpr, p.y2 * dpr); ctx.lineTo((p.x2 - p.w / 2) * dpr, p.y2 * dpr); ctx.closePath(); ctx.fill(); Z.fx.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= (p.k === "fire" ? .035 : p.k === "drop" ? .03 : .012) * dt;
      if (p.k === "drop") p.vy += .25 * dt;
      if (p.life <= 0) { Z.fx.splice(i, 1); continue; }
      if (p.k === "fire") {
        ctx.globalCompositeOperation = "lighter";
        const r = p.r * (1.6 - p.life) * dpr, g = ctx.createRadialGradient(p.x * dpr, p.y * dpr, 0, p.x * dpr, p.y * dpr, r);
        g.addColorStop(0, `rgba(255,${Math.round(200 * p.life + 40)},80,${p.life})`); g.addColorStop(1, "rgba(255,60,0,0)");
        ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x * dpr, p.y * dpr, r, 0, 6.3); ctx.fill();
        ctx.globalCompositeOperation = "source-over";
      } else {
        ctx.globalAlpha = p.life * (p.k === "smoke" ? .35 : .8); ctx.fillStyle = p.k === "smoke" ? "#9a9090" : "#bfe9ff";
        ctx.beginPath(); ctx.arc(p.x * dpr, p.y * dpr, p.r * (p.k === "smoke" ? (2 - p.life) : 1) * dpr, 0, 6.3); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  };
  Z.raf = requestAnimationFrame(step);
}
addEventListener("resize", () => { const cv = $("#cfx"); if (cv && Z.raf) { const dpr = Math.min(1.5, devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; } });

/* ───────────── TMDB live library (only when a key is configured) ─────────────
   Thousands of titles, posters and India streaming data, fetched straight from the browser.
   Curated titles keep their hand-checked exact links; live ones open a search inside the app. */
const T = {key: "", base: "https://api.themoviedb.org/3", cache: new Map(), provIds: {}, failed: false};
const STREAM = {watch_region: "IN", with_watch_monetization_types: "flatrate|free|ads", sort_by: "popularity.desc"};
const LIVE = {
  foryou: [["Trending this week", "/trending/all/week", {}],
           ["Telugu movies streaming now", "/discover/movie", Object.assign({with_original_language: "te"}, STREAM)],
           ["Popular anime right now", "/discover/tv", {with_genres: "16", with_original_language: "ja", sort_by: "popularity.desc"}]],
  anime: [["More anime series", "/discover/tv", {with_genres: "16", with_original_language: "ja", sort_by: "popularity.desc"}],
          ["More anime movies", "/discover/movie", {with_genres: "16", with_original_language: "ja", sort_by: "popularity.desc"}]],
  movie: [["More Telugu movies", "/discover/movie", Object.assign({with_original_language: "te"}, STREAM)],
          ["Tamil movies", "/discover/movie", Object.assign({with_original_language: "ta"}, STREAM)],
          ["Hindi movies", "/discover/movie", Object.assign({with_original_language: "hi"}, STREAM)],
          ["Malayalam movies", "/discover/movie", Object.assign({with_original_language: "ml"}, STREAM)],
          ["Hollywood on Indian OTT", "/discover/movie", Object.assign({with_original_language: "en"}, STREAM)]],
  series: [["More Indian series", "/discover/tv", Object.assign({with_origin_country: "IN"}, STREAM)],
           ["International series", "/discover/tv", Object.assign({with_original_language: "en"}, STREAM)],
           ["K-dramas", "/discover/tv", Object.assign({with_original_language: "ko"}, STREAM)]],
  reality: [["More reality shows", "/discover/tv", {with_genres: "10764", with_origin_country: "IN", sort_by: "popularity.desc"}]],
};
const PLATS = ["netflix", "prime", "hotstar", "appletv", "crunchyroll", "sonyliv", "zee5", "aha"];
const PROV_RX = [[/amazon channel/i, "prime"], [/netflix/i, "netflix"], [/prime video|amazon video/i, "prime"], [/hotstar/i, "hotstar"],
                 [/apple ?tv/i, "appletv"], [/crunchyroll/i, "crunchyroll"], [/sony ?liv/i, "sonyliv"], [/zee ?5/i, "zee5"], [/^aha/i, "aha"], [/fancode/i, "fancode"]];
const STORE_IDS = new Set([2, 3, 7, 10, 68, 192]);
const provKey = name => { for (const [rx, k] of PROV_RX) if (rx.test(name)) return k; return null; };
const enc = encodeURIComponent;
const FIND = {   // in-app search where the site supports it; otherwise open the app
  netflix: t => `https://www.netflix.com/search?q=${enc(t)}`,
  prime: t => `https://www.primevideo.com/search/ref=atv_nb_sr?phrase=${enc(t)}`,
  crunchyroll: t => `https://www.crunchyroll.com/search?q=${enc(t)}`,
  zee5: t => `https://www.zee5.com/search?q=${enc(t)}`,
};
const HOME = {appletv: "https://tv.apple.com/in", hotstar: "https://www.hotstar.com/in", sonyliv: "https://www.sonyliv.com", aha: "https://www.aha.video", fancode: "https://www.fancode.com"};
// Accents are dropped (Bāhubali -> bahubali) and, for matching the same title, doubled letters too (Baahubali -> bahubali)
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const twinKey = s => norm(s).replace(/(.)\1+/g, "$1");

async function tget(path, params) {
  const u = new URL(T.base + path);
  u.searchParams.set("api_key", T.key); u.searchParams.set("language", "en-IN");
  Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  const key = u.toString();
  if (T.cache.has(key)) return T.cache.get(key);
  const r = await fetch(key);
  if (!r.ok) throw new Error("TMDB " + r.status);
  const j = await r.json(); T.cache.set(key, j); return j;
}
function tmdbFail() {
  if (!T.failed) { T.failed = true; toast("Couldn't reach TMDB. Showing the hand-picked library."); }
  document.querySelectorAll("[data-livebox]").forEach(b => b.remove());
}

function fromTmdb(r, typeHint) {
  const type = r.media_type || typeHint;
  if ((type !== "movie" && type !== "tv") || !r.poster_path) return null;
  const g = r.genre_ids || [];
  const kind = g.includes(16) && r.original_language === "ja" ? "anime" : g.includes(10764) ? "reality" : type === "tv" ? "series" : "movie";
  const title = r.title || r.name || "";
  const year = (r.release_date || r.first_air_date || "").slice(0, 4);
  const it = {id: `tmdb:${type}:${r.id}`, tmdb: {type, id: r.id}, title, kind, year, meta: "", genres: [], synopsis: r.overview || "",
    moods: [], telugu: r.original_language === "te", imdb: null, score: r.vote_average ? Math.round(r.vote_average * 10) / 10 : null,
    poster: null, tmdbPoster: r.poster_path, status: null, note: "", emoji: "🎬", colors: ["#3F2A3A", "#1B1220"], offers: [],
    trailer: "https://www.youtube.com/results?search_query=" + enc(`${title} ${year} trailer`)};
  const twin = curatedTwin(it);
  if (twin) return twin;                                 // prefer our hand-checked version
  if (!BY[it.id]) BY[it.id] = it;
  return BY[it.id];
}
function curatedTwin(it) {
  const n = twinKey(it.title);
  // "F1" on TMDB is our "F1: The Movie", so also compare the part before a colon
  return D.items.find(c => c.kind !== "sports" && (twinKey(c.title) === n || twinKey(c.title.split(":")[0]) === n)
    && (!it.year || !c.year || Math.abs(+c.year - +it.year) <= 1)) || null;
}
const slim = it => ({id: it.id, tmdb: it.tmdb, title: it.title, kind: it.kind, year: it.year, score: it.score, tmdbPoster: it.tmdbPoster,
  synopsis: it.synopsis, telugu: it.telugu, trailer: it.trailer});
function rehydrate(m) {
  return Object.assign({meta: "", genres: [], moods: [], imdb: null, poster: null, status: null, note: "", emoji: "🎬",
    colors: ["#3F2A3A", "#1B1220"], offers: []}, m);
}

/* live rows */
const liveState = {};
function liveDef(key) {
  const [a, b, c] = key.split("|");
  if (a === "plat") {
    const ids = (T.provIds[b] || []).join("|");
    return {title: `${c === "movie" ? "Movies" : "Series"} on ${D.providers[b].name}`, path: `/discover/${c}`,
            params: Object.assign({with_watch_providers: ids}, STREAM), type: c};
  }
  const [title, path, params] = LIVE[a][+b];
  return {title, path, params, type: path.includes("/tv") ? "tv" : "movie"};
}
const skeleton = n => Array.from({length: n}, () => `<div class="card sk" aria-hidden="true"><div class="pw"></div><div class="sk-t"></div></div>`).join("");
function liveRowHTML(key) {
  return `<div data-livebox><div class="sec"><h2>${esc(liveDef(key).title)}</h2><p class="live-sub"><i></i>Live</p></div>` +
         `<div class="row" data-live="${esc(key)}">${skeleton(6)}</div></div>`;
}
function liveRowsHTML(tab) {
  if (!T.key || T.failed || !LIVE[tab]) return "";
  const extra = {movie: ["plat|appletv|movie"], series: ["plat|appletv|tv"]}[tab] || [];   // endless Apple TV catalogue rows
  return extra.map(liveRowHTML).join("") + LIVE[tab].map((_, i) => liveRowHTML(`${tab}|${i}`)).join("");
}
function platformsHTML() {
  if (!T.key || T.failed) return "";
  return section("Browse by platform", "") + `<div class="chips" role="group" aria-label="Platforms">${PLATS.map(k =>
    `<button class="chip" data-plat="${k}" aria-pressed="false"><i class="pc" style="--pcol:${D.providers[k].color}">${esc(D.providers[k].name[0])}</i>${esc(D.providers[k].name)}</button>`).join("")}</div><div id="platbox"></div>`;
}
async function showPlatform(k) {
  document.querySelectorAll("[data-plat]").forEach(c => c.setAttribute("aria-pressed", c.dataset.plat === k));
  await ensureProviders();
  const box = $("#platbox"); if (!box) return;
  if (!(T.provIds[k] || []).length) { box.innerHTML = `<div class="empty">No catalogue data for ${esc(D.providers[k].name)} right now.</div>`; return; }
  box.innerHTML = liveRowHTML(`plat|${k}|movie`) + liveRowHTML(`plat|${k}|tv`);
  fillLive(box);
}
function fillLive(root) {
  if (!T.key || T.failed) return;
  root.querySelectorAll("[data-live]").forEach(el => {
    const st = liveState[el.dataset.live];
    if (st && st.ids.length) el.innerHTML = st.ids.map(id => BY[id]).filter(Boolean).map(card).join("");
    else loadLive(el.dataset.live);
  });
}
async function loadLive(key) {
  const st = liveState[key] || (liveState[key] = {ids: [], page: 0, total: 1, busy: false});
  if (st.busy || st.page >= st.total || st.page >= 20) return;
  st.busy = true;
  try {
    if (key.startsWith("plat|")) await ensureProviders();
    const def = liveDef(key);
    const j = await tget(def.path, Object.assign({page: st.page + 1}, def.params));
    st.page = j.page || st.page + 1; st.total = j.total_pages || 1;
    const seen = new Set(st.ids);
    const fresh = (j.results || []).map(r => fromTmdb(r, def.type)).filter(it => it && !seen.has(it.id) && (seen.add(it.id), true));
    fresh.forEach(it => st.ids.push(it.id));
    const el = document.querySelector(`[data-live="${CSS.escape(key)}"]`);
    if (el) {
      if (st.page === 1) el.innerHTML = fresh.map(card).join("") || `<div class="empty">Nothing here yet.</div>`;
      else el.insertAdjacentHTML("beforeend", fresh.map(card).join(""));
      [...el.querySelectorAll(".card")].slice(-fresh.length).forEach((c, i) => { c.classList.add("fresh"); c.style.setProperty("--i", i); });
    }
  } catch (e) { tmdbFail(); }
  st.busy = false;
}
// endless rows: fetch the next page as a live row nears its end
document.addEventListener("scroll", e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.live) return;
  if (el.scrollLeft + el.clientWidth > el.scrollWidth - 500) loadLive(el.dataset.live);
}, true);

function ensureProviders() {
  if (T.provReady) return T.provReady;
  T.provReady = Promise.all(["movie", "tv"].map(t => tget(`/watch/providers/${t}`, {watch_region: "IN"}))).then(rs => {
    rs.forEach(r => (r.results || []).forEach(p => {
      const k = provKey(p.provider_name);
      // Only subscription services: skip rent/buy stores (Apple TV store = 2, Amazon Video = 10, Google Play = 3...)
      // and add-on channels, or rows fill up with titles you can only rent there.
      if (!k || STORE_IDS.has(p.provider_id) || /channel|with ads|store|rent|buy/i.test(p.provider_name)) return;
      T.provIds[k] = T.provIds[k] || [];
      if (!T.provIds[k].includes(p.provider_id)) T.provIds[k].push(p.provider_id);
    }));
  }).catch(() => {});
  return T.provReady;
}

/* detail sheet for live titles */
const details = {};
async function loadDetails(it) {
  if (details[it.id]) return;
  try {
    const d = await tget(`/${it.tmdb.type}/${it.tmdb.id}`, {append_to_response: "watch/providers"});
    const ind = (d["watch/providers"] && d["watch/providers"].results && d["watch/providers"].results.IN) || {};
    const seen = new Set(), provs = [];
    ["flatrate", "free", "ads"].forEach(kind => (ind[kind] || []).forEach(p => {
      if (seen.has(p.provider_id)) return; seen.add(p.provider_id);
      provs.push({name: p.provider_name, logo: p.logo_path, key: provKey(p.provider_name), kind});
    }));
    const byKey = new Map(), other = [];          // one button per app
    provs.forEach(p => { if (!p.key) other.push(p); else if (!byKey.has(p.key)) byKey.set(p.key, p); });
    details[it.id] = {genres: (d.genres || []).map(g => g.name).slice(0, 4),
      len: d.runtime ? `${Math.floor(d.runtime / 60)}h ${d.runtime % 60}m` : d.number_of_seasons ? `${d.number_of_seasons} season${d.number_of_seasons > 1 ? "s" : ""}` : "",
      apps: [...byKey.values()], other, link: ind.link || ""};
    askExactLinks(details[it.id].link);
  } catch (e) { details[it.id] = {genres: [], len: "", apps: [], other: [], link: "", error: true}; }
  if (openId === it.id) refreshSheet();
}
/* Exact per-app links: the VibeSync server reads this title's watch page once and returns the real
   destination behind each app button, so taps open the title in the app directly. */
const RESOLVED = {}, ASKED = new Set();
function askExactLinks(link) {
  if (!EMBED || !link || RESOLVED[link] || ASKED.has(link)) return;
  ASKED.add(link);
  send("streamlit:setComponentValue", {value: {theme: document.documentElement.dataset.theme, resolve: link, n: Date.now()}, dataType: "json"});
  setTimeout(() => { if (!RESOLVED[link]) { RESOLVED[link] = {}; if (openId && details[openId] && details[openId].link === link) refreshSheet(); } }, 9000);
}
function exactLink(d, name) {
  const map = d && d.link && RESOLVED[d.link]; if (!map) return null;
  const n = norm(name);
  if (map[n]) return map[n];
  const k = Object.keys(map).find(k => k.length > 3 && (k.includes(n) || n.includes(k)));
  return k ? map[k] : null;
}
// In the Android app, tell it which app was tapped: it reads the watch page itself and jumps straight to the title.
const viaApp = (link, name) => IN_APP ? link + (link.includes("?") ? "&" : "?") + "vs_app=" + encodeURIComponent(name) : link;
function tmdbSheetHTML(it) {
  const d = details[it.id];
  const logo = p => p.logo ? `<img class="plogo" src="https://image.tmdb.org/t/p/w92${p.logo}" alt="">`
                           : `<span class="logo">${esc(p.name[0])}</span>`;
  let where;
  if (!d) where = `<div class="checking"><i></i>Checking where it streams in India…</div>`;
  else if (d.error) where = `<div class="note">Couldn't load streaming info. Try again in a moment.</div>`;
  else if (!d.apps.length && !d.other.length) where = `<div class="note">Not streaming in India right now.</div>`;
  else where = `<div class="offers">` + d.apps.map(p => {
      // TMDB's watch page (powered by JustWatch) links to this exact title on each app.
      // Without it, fall back to searching inside the app.
      const direct = exactLink(d, p.name), pending = d.link && EMBED && !RESOLVED[d.link];
      const url = direct ? linkFor(direct, p.key) : d.link ? viaApp(d.link, p.name) : FIND[p.key] ? linkFor(FIND[p.key](it.title), p.key) : linkFor(HOME[p.key], p.key);
      const sub = direct || (IN_APP && d.link) ? "Opens this exact title" : pending ? "Finding the exact link…" : d.link ? `Tap ${D.providers[p.key].name} on the next screen to open this title` : FIND[p.key] ? "Opens the app and searches this title" : "Opens the app";
      return `<a class="offer" style="--pcol:${D.providers[p.key].color}" href="${esc(url)}" target="_blank" rel="noopener">${logo(p)}
        <span><b>${esc(D.providers[p.key].name)}</b><small>${sub}</small></span><span class="go">${ICON.play}Watch</span></a>`;
    }).join("") + d.other.map(p => { const direct = exactLink(d, p.name);
      const exact = direct || (IN_APP && d.link);
      return `<a class="offer" href="${esc(direct || (d.link ? viaApp(d.link, p.name) : it.trailer))}" target="_blank" rel="noopener">${logo(p)}
        <span><b>${esc(p.name)}</b><small>${exact ? "Opens this exact title" : "See watch options"}</small></span><span class="go">${exact ? ICON.play + "Watch" : "View"}</span></a>`; }).join("") + `</div>`;
  const body = `<div class="tags">${it.telugu ? `<span class="tag tel">Telugu</span>` : ""}${(d ? d.genres : []).map(g => `<span class="tag">${esc(g)}</span>`).join("")}</div>
    <p class="syn">${esc(it.synopsis || "No description yet.")}</p>
    <div class="h3">Where to watch in India</div>${where}
    <div class="acts"><a class="btn tint" href="${esc(ytLink(it))}" target="_blank" rel="noopener">${ICON.play}Trailer</a>${saveBtn(it)}</div>
    <p class="foot2">Streaming data from JustWatch via TMDB. Line-ups change, so the app may differ slightly.</p>`;
  return sheetShell(it, [fact(it.score ? `★ ${it.score.toFixed(1)} TMDB` : "", "sc"), fact(esc(it.year)), d ? fact(esc(d.len)) : "", fact(esc(kindLabel(it)))], body);
}

/* search */
let searchT = null;
function searchTmdb(q, have, forQ = q) {
  clearTimeout(searchT);
  searchT = setTimeout(async () => {
    let items = [];
    try {
      const j = await tget("/search/multi", {query: q, include_adult: "false"});
      const skip = new Set(have);
      items = (j.results || []).map(r => fromTmdb(r)).filter(it => it && !skip.has(it.id)).slice(0, 24);
    } catch (e) { /* offline or bad key: local results only */ }
    const box = $("#tsearch"), input = $("#q");
    if (!box || !input || input.value.trim().toLowerCase() !== forQ) return;
    box.innerHTML = items.length ? section("More titles", "Live from TMDB") + grid(items) : "";
  }, 350);
}
/* ───────────── boot ───────────── */
function boot(data) {
  if (D) return;
  D = data; D.items.forEach(i => BY[i.id] = i);
  D.featured = pickFeatured();
  T.key = (args.tmdbKey || new URLSearchParams(location.search).get("tmdb") || "").trim();
  Object.values(store.get("favMeta", {})).forEach(m => { if (!BY[m.id]) BY[m.id] = rehydrate(m); });
  applyTheme("cinema", false);                   // the four fixed looks are gone; title themes replace them
  render(); fillLive(document); fitHeight();
  applyTitle(TT.cur, true);
  if (T.key) ensureProviders();
}
window.addEventListener("message", e => {
  const m = e.data;
  if (!m || m.type !== "streamlit:render") return;
  args = m.args || {};
  if (args.catalog) boot(args.catalog);
  if (args.resolved && typeof args.resolved === "object") {
    let fresh = false;
    Object.entries(args.resolved).forEach(([k, v]) => { if (!RESOLVED[k] || !Object.keys(RESOLVED[k]).length) { RESOLVED[k] = v || {}; fresh = true; } });
    if (fresh && openId && BY[openId] && BY[openId].tmdb) refreshSheet();
  }
  if (D && args.tmdbKey && !T.key) { T.key = args.tmdbKey.trim(); setTab(state.tab); }
  else if (!D) fetch("catalog.json").then(r => r.json()).then(boot).catch(() => {});
  fitHeight();
});
send("streamlit:componentReady", {apiVersion: 1});
// Standalone fallback (opened directly, or if the render message never arrives)
setTimeout(() => { if (!D) fetch("catalog.json").then(r => r.json()).then(boot).catch(() => {}); }, 900);
fitHeight();
})();
</script>
