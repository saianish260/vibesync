// hero: the spotlight follows your finger, the next title slides in alongside it, and letting go
// either carries on (far enough, or a quick flick) or springs back. Press and hold pauses, like stories.
(() => {
  let s = null, swallow = false;
  const slides = () => $$("#slides .slide");
  const clear = el => { if (el) { el.style.transform = ""; el.style.opacity = ""; el.style.transition = ""; el.style.willChange = ""; el.classList.remove("peek"); } };
  document.addEventListener("pointerdown", e => {
    const h = e.target.closest("#hero"); if (!h || e.button > 0 || e.target.closest("[data-dot]")) return;
    const all = slides(); if (all.length < 2) return;
    s = {x: e.clientX, y: e.clientY, dx: 0, v: 0, lx: e.clientX, lt: performance.now(), drag: false, w: h.clientWidth, cur: all[state.slide], nb: null, dir: 0};
    pauseHero(true);
  }, {passive: true});
  document.addEventListener("pointermove", e => {
    if (!s) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y, now = performance.now();
    if (!s.drag) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { s = null; if (!heroOff && !openId) pauseHero(false); return; }   // a scroll
      if (Math.abs(dx) < 8) return;
      s.drag = true;
    }
    s.v = s.v * .6 + .4 * (e.clientX - s.lx) / Math.max(1, now - s.lt); s.lx = e.clientX; s.lt = now; s.dx = dx;
    const dir = dx < 0 ? 1 : -1, all = slides();
    if (dir !== s.dir) { clear(s.nb); s.dir = dir; s.nb = all[(state.slide + dir + all.length) % all.length]; s.nb.classList.add("peek"); }
    const p = Math.min(1, Math.abs(dx) / s.w);
    s.cur.style.transition = s.nb.style.transition = "none"; s.cur.style.willChange = s.nb.style.willChange = "transform,opacity";
    s.cur.style.transform = `translate3d(${dx}px,0,0) scale(${1 - p * .06})`; s.cur.style.opacity = Math.max(0, 1 - p * 1.8);
    s.nb.style.transform = `translate3d(${dx + dir * s.w * .85}px,0,0) scale(${.94 + p * .06})`; s.nb.style.opacity = Math.min(1, p * 1.8);
  }, {passive: true});
  const end = () => {
    if (!s) return;
    const {drag, dx, v, w, cur, nb, dir} = s; s = null;
    if (!drag || !nb) { if (!heroOff && !openId) pauseHero(false); return; }
    swallow = true; setTimeout(() => swallow = false, 60);
    const go = Math.abs(dx) > w * .2 || (Math.abs(v) > .35 && Math.sign(v) === -dir);
    const ease = "cubic-bezier(.16,1,.3,1)", dur = Math.round(Math.max(260, 520 - Math.abs(v) * 160));
    if (go) {
      cur.style.transition = nb.style.transition = `transform ${dur}ms ${ease}, opacity ${dur}ms ${ease}`;
      cur.style.transform = `translate3d(${-dir * w * .6}px,0,0) scale(.94)`; cur.style.opacity = 0;
      nb.style.transform = "translate3d(0,0,0)"; nb.style.opacity = 1;
      setTimeout(() => { showSlide(state.slide + dir); requestAnimationFrame(() => { clear(cur); clear(nb); }); startHero(); if (!heroOff && !openId) pauseHero(false); }, dur);
    } else {
      cur.style.transition = nb.style.transition = `transform 480ms ${EASE}, opacity 380ms ease`;
      cur.style.transform = ""; cur.style.opacity = ""; nb.style.transform = `translate3d(${dir * w * .85}px,0,0)`; nb.style.opacity = 0;
      setTimeout(() => clear(nb), 480);
      if (!heroOff && !openId) pauseHero(false);
    }
  };
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);

async function b64z(str) {
  const bytes = new TextEncoder().encode(str);
  let out = bytes, z = "0";
  if (window.CompressionStream) { out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); z = "1"; }
  let bin = ""; out.forEach(b => bin += String.fromCharCode(b));
  return "VS" + z + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function unb64z(code) {

  const z = code[2] === "1", b = atob(code.slice(3).replace(/-/g, "+").replace(/_/g, "/"));
  let bytes = Uint8Array.from(b, c => c.charCodeAt(0));
  if (z) bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  return new TextDecoder().decode(bytes);
}

/* ───────────── Live updates for reality shows (Bigg Boss…) ─────────────

   🚪 Elimination update (who was evicted) and 📅 This week (nominations, captaincy, tasks, wild cards).

const agoTxt = t => { const m = Math.round((Date.now() - t) / 60e3); return m < 1 ? "just now" : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
